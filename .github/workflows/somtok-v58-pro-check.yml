name: somtok-v59-pro-production-qa

on:
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.event.pull_request.head.ref == 'agent/somtok-v58-pro-check'
    runs-on: ubuntu-latest
    steps:
      - name: Verify version and real grounded PRO responses
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          version_url='https://lovetalk-api.onrender.com/api/version'
          api_url='https://lovetalk-api.onrender.com/api/love-analysis'
          expected='2026-08-23-potentia-v59-fast-pro-grounding'
          with urllib.request.urlopen(version_url,timeout=20) as r:
              version=json.loads(r.read().decode()).get('version')
          print('SERVER_VERSION',version)
          assert version==expected,(version,expected)
          cases=[
            ('deep', '소개팅 이후 서로 일상 이야기를 주고받고 있고 상대도 질문을 해. 지금 관계 흐름을 상세히 봐줘.'),
            ('confession', '[PRO 고백 타이밍] 최근에는 서로 일상 이야기를 주고받고 있고 상대도 질문을 해. 고백하기 좋은 흐름인지 봐줘.'),
            ('date', '[PRO 데이트 타이밍] 대화가 자연스럽게 이어지고 있고 상대가 영화 이야기를 했어. 약속 제안 시점을 봐줘.'),
            ('risk', '[PRO 위험 신호 감지] 상대가 답장을 재촉하는 말을 가끔 해. 아직 반복되는지는 모르겠어. 과장 없이 점검해줘.'),
            ('monthly', '[PRO 월간 관계 리포트] 최근 30일 기록: 서로 안부 질문을 했고, 내가 먼저 연락한 날도 있으며, 상대가 주제를 이어간 날도 있었어. 행동 변화만 정리해줘.'),
            ('memory', '[PRO 상대별 AI 기억 강화] 사용자가 직접 확인한 사실: 상대는 커피를 좋아한다고 말했고 최근 두 대화에서 상대가 질문을 했어. 저장할 사실과 추론을 구분해줘.')
          ]
          required=['meaning','emotion','flow','strategy','caution','advice','nextAction']
          outputs={}
          for name,message in cases:
              payload={'relation':'썸','nickname':'테스트상대','message':message,'tone':'차분하고 현실적으로','mode':'detail','advanced':True,'recentMemory':'','images':[]}
              req=urllib.request.Request(api_url,data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
              t0=time.perf_counter()
              with urllib.request.urlopen(req,timeout=40) as r:
                  d=json.loads(r.read().decode())
              elapsed=round(time.perf_counter()-t0,2)
              outputs[name]=d
              print('\n=== CASE',name,'ELAPSED',elapsed,'s ===')
              print(json.dumps(d,ensure_ascii=False,indent=2))
              assert d.get('serverVersion')==expected
              missing=[k for k in required if not str(d.get(k,'')).strip()]
              assert not missing,(name,'missing',missing)
              assert d.get('confidence') in ['높음','중간','낮음'],(name,d.get('confidence'))
              assert isinstance(d.get('replies'),list),(name,'replies_not_list')
              assert elapsed <= 30,(name,'too_slow',elapsed)

              combined=' '.join(str(d.get(k,'')) for k in ['meaning','emotion','flow','strategy','caution','dontSend','advice','nextAction'])
              reply_text=' '.join(str(x.get('text','')) for x in (d.get('replies') or []) if isinstance(x,dict))
              if name=='deep':
                  assert '[' not in reply_text and '(상대' not in reply_text and '(답변' not in reply_text,(name,'placeholder_reply',reply_text)
                  assert '저도 어제' not in reply_text and '날씨가 좋네요' not in reply_text,(name,'invented_example',reply_text)
                  assert '2~3일' not in d.get('nextAction',''),(name,'invented_timing')
              elif name=='confession':
                  assert d.get('replies')==[],(name,'should_not_generate_message',d.get('replies'))
                  assert '고백 수용 의사' in combined or '고백 타이밍' in combined
              elif name=='date':
                  assert len(d.get('replies') or [])==3,(name,'expected_grounded_replies')
                  assert '저도' not in reply_text and '자꾸 보고 싶' not in reply_text and '영화 재미있어요' not in reply_text,(name,'invented_user_state',reply_text)
                  assert '실제 가능한 일정' in d.get('nextAction','') or '가능한 시간' in d.get('nextAction',''),(name,'availability_not_guarded')
              elif name=='risk':
                  assert d.get('replies')==[],(name,'analysis_tool_should_not_send')
                  assert '관심 신호로 환산하지 않습니다' in combined,(name,'interest_inference_not_blocked',combined)
                  assert '2~3주' not in combined,(name,'invented_observation_period')
              elif name=='monthly':
                  assert d.get('replies')==[],(name,'report_should_not_send')
                  assert '횟수와 비율' in combined or '빈도' in combined,(name,'insufficient_counts_not_acknowledged')
                  assert '2~3주' not in combined,(name,'invented_wait_period')
              elif name=='memory':
                  assert d.get('replies')==[],(name,'memory_tool_should_not_send')
                  assert '감정 가설' in combined or 'AI 추론' in combined,(name,'fact_inference_separation_missing')
                  assert '상대 메시지' not in d.get('nextAction',''),(name,'irrelevant_reply_prompt')
          print('\nALL_V59_PRO_TESTS_OK')
          PY
