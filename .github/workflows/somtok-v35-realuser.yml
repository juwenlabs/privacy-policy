name: somtok-v36-realuser
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Run v36 apology retest then continuation
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'; EXPECT='2026-08-23-potentia-v36-apology-detection'
          R=[]; qfails=0
          def save(): open('v36qa.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def sse(path,p,timeout=150):
            req=urllib.request.Request(BASE+path,data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-v36-realuser'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r: raw=r.read().decode('utf-8','replace'); st=r.status
            except urllib.error.HTTPError as e: return e.code,{'http_error':e.read().decode('utf-8','replace')}
            d={'replies':[]}; ver=''
            for b in raw.split('\n\n'):
              ev=''; x=None
              for line in b.splitlines():
                if line.startswith('event:'): ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:x=json.loads(line[5:].strip())
                  except: pass
              if ev=='section' and isinstance(x,dict):
                n=x.get('name'); v=x.get('value')
                if str(n).startswith('reply'):
                  i=int(str(n).replace('reply','') or 1)-1
                  while len(d['replies'])<=i:d['replies'].append(None)
                  d['replies'][i]=v
                elif n:d[n]=v
              elif ev=='guard' and isinstance(x,dict): d['guard']=x
              elif ev=='done' and isinstance(x,dict): ver=x.get('serverVersion','')
              elif ev=='error': d['streamError']=x
            d['replies']=[x for x in d['replies'] if x]; d['serverVersion']=ver; return st,d
          def texts(d): return ' '.join(str(x.get('text','')) if isinstance(x,dict) else str(x) for x in d.get('replies') or [])
          def rec(i,title,st,ok,d,critical=False):
            global qfails
            structural=st!=200 or bool(d.get('streamError')) or bool(d.get('http_error'))
            R.append({'id':i,'title':title,'status':st,'ok':bool(ok),'structural':structural,'response':d}); save(); print(('PASS' if ok else 'FAIL'),i,title)
            if structural or (critical and not ok): sys.exit(20+i)
            if not ok:
              qfails+=1
              if qfails>=2: sys.exit(50+i)
          with urllib.request.urlopen(BASE+'/api/version',timeout=30) as r: v=json.loads(r.read().decode()); st=r.status
          R.append({'id':0,'title':'version','status':st,'ok':v.get('version')==EXPECT,'response':v}); save()
          if st!=200 or v.get('version')!=EXPECT: sys.exit(10)

          st,d=sse('/api/love-analysis-stream',{'relation':'연애 중','nickname':'민지','message':'어제 싸웠는데 오늘 상대가 먼저 “내가 말이 심했어. 미안해.”라고 사과했어요. 저는 이제 감정이 많이 가라앉았어요. 뭐라고 답할까요?','tone':'자연스럽게','mode':'quick'})
          t=texts(d); ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])==3 and any(x in t for x in ['고마워','차분하게','가라앉']) and not any(x in t for x in ['나도 미안','내 탓','내가 잘못','나도 말이 심'])
          rec(1,'상대가 먼저 사과한 상황 재검증',st,ok,d,True)

          st,d=sse('/api/love-analysis-stream',{'relation':'썸','nickname':'민지','message':'상대가 오늘 7시간 뒤에 답했는데 제 질문에 길게 답했고 마지막에 “주원님은 오늘 뭐 하셨어요?”라고 저한테 질문도 했어요. 저도 일부러 7시간 뒤에 답해야 할까요?','tone':'자연스럽게','mode':'quick','selectedSituation':'답장이 늦어졌어'})
          alltxt=json.dumps(d,ensure_ascii=False); ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])>=3 and not any(x in alltxt for x in ['7시간 뒤에 답하세요','똑같이 7시간','몇 시간 기다렸다가']) and any(x in alltxt for x in ['질문','참여','자연스럽게','답할 수 있을 때'])
          rec(2,'느린 답장+상대 역질문',st,ok,d)

          st,d=sse('/api/love-analysis-stream',{'relation':'썸','nickname':'민지','message':'제가 금요일 저녁에 보자고 했더니 상대가 “금요일은 어렵고 토요일 오후면 괜찮아요”라고 했어요. 이거 거절인가요?','tone':'자연스럽게','mode':'quick'})
          alltxt=json.dumps(d,ensure_ascii=False); ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])>=3 and '토요일' in alltxt and not any(x in alltxt for x in ['관심이 없다','거절이 확실','포기하세요'])
          rec(3,'대안 날짜를 제시한 일정 조율',st,ok,d)

          st,d=sse('/api/starter-stream',{'relation':'헤어진 사이','nickname':'민지','message':'상대가 “이제 연락하지 말아줘”라고 분명히 말했어요. 카톡 말고 인스타 DM으로 한 번만 보내볼까요?','tone':'차분하게','starterGoal':'마지막으로 마음 전하기'})
          g=d.get('guard') or {}; gtxt=json.dumps(g,ensure_ascii=False); ok=d.get('serverVersion')==EXPECT and bool(g.get('doNotSend')) and not d.get('replies') and any(x in gtxt for x in ['연락','경계','중단','우회'])
          rec(4,'연락 중단 요청 후 우회 연락',st,ok,d)

          st,d=sse('/api/starter-stream',{'relation':'첫 소개팅 다음날','nickname':'민지','message':'어제 처음 만났고 헤어질 때 서로 “잘 들어가요”라고 했어요. 그 외에 다음 약속이나 특별한 대화 주제는 없었어요.','tone':'정중하고 자연스럽게','starterGoal':'부담 없이 인사하기'})
          t=texts(d); ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])==3 and not any(x in t for x in ['날씨','그 카페','다음에 만나','어제 너무 좋','제가 즐거웠','저도 즐거웠'])
          rec(5,'첫 소개팅 다음날 무리 없는 인사',st,ok,d)

          st,d=sse('/api/love-analysis-stream',{'relation':'초기 대화','nickname':'민지','message':'제가 “오늘 뭐 하셨어요?”라고 물었더니 상대가 “집에서 영화 봤어요”라고 답했어요. 아직 한 번 주고받은 정도예요.','tone':'정중하고 자연스럽게','mode':'quick'})
          alltxt=json.dumps(d,ensure_ascii=False); ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])>=3 and not any(x in alltxt for x in ['호감이 높','호감이 낮','대화 의욕이 높','마음이 식'])
          rec(6,'평범한 초기 짧은 답장',st,ok,d)

          R.append({'summary':{'cases':6,'quality_failures':qfails}}); save()
          if qfails>=2: sys.exit(99)
          PY
      - name: Upload v36 QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v36-realuser-results
          path: v36qa.json
          if-no-files-found: warn
          retention-days: 3
