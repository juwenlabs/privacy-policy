name: somtok-v70-starter-targeted-qa

on:
  pull_request:
    branches: [main]

jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v68-final-qa'
    runs-on: ubuntu-latest
    steps:
      - name: Retest v70 starter only
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          B='https://lovetalk-api.onrender.com'; V='2026-08-24-potentia-v70-grounded-starter'
          with urllib.request.urlopen(B+'/api/version',timeout=20) as r: got=json.loads(r.read().decode()).get('version')
          print('SERVER_VERSION',got); assert got==V,(got,V)
          def post(payload):
              req=urllib.request.Request(B+'/api/starter',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
              t=time.perf_counter()
              with urllib.request.urlopen(req,timeout=20) as r:d=json.loads(r.read().decode())
              return d,round(time.perf_counter()-t,2)
          ctx='최근에 서로 영화 이야기를 했고 상대가 액션 영화를 좋아한다고 말했어.'
          for name,advanced in [('starter_normal',False),('starter_advanced',True)]:
              d,sec=post({'relation':'썸','nickname':'테스트상대','message':ctx,'tone':'자연스럽게','starterGoal':'대화를 자연스럽게 이어가기' if advanced else '부담 없이 먼저 연락하기','profile':None,'recentMemory':'','selectedSituation':'','advanced':advanced})
              print('\n===',name,sec,'s ===');print(json.dumps(d,ensure_ascii=False,indent=2))
              assert d.get('serverVersion')==V and isinstance(d.get('replies'),list) and len(d['replies'])==3
              texts=' '.join(str(x.get('text','')) for x in d['replies'] if isinstance(x,dict))
              assert '생각났' not in texts and '어제' not in texts and ' ㅎ' not in texts and 'ㅋㅋ' not in texts and 'ㅎㅎ' not in texts
              assert not any(x in texts for x in ['토요일','일요일','다음 주','카페'])
              assert '액션 영화' in texts
              assert sec < 3.0,(name,'too_slow',sec)
          print('ALL_V70_STARTER_TARGETED_QA_OK')
          PY
