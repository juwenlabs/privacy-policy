name: somtok-v69-targeted-core-qa

on:
  pull_request:
    branches: [main]

jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v68-final-qa'
    runs-on: ubuntu-latest
    steps:
      - name: Retest v69 starter and reply speed/quality
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,statistics
          B='https://lovetalk-api.onrender.com'; V='2026-08-24-potentia-v69-fast-compact-core'
          with urllib.request.urlopen(B+'/api/version',timeout=20) as r: got=json.loads(r.read().decode()).get('version')
          print('SERVER_VERSION',got); assert got==V,(got,V)
          def post(path,payload):
              req=urllib.request.Request(B+path,data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
              t=time.perf_counter()
              with urllib.request.urlopen(req,timeout=25) as r:d=json.loads(r.read().decode())
              return d,round(time.perf_counter()-t,2)
          results=[]
          ctx='최근에 서로 영화 이야기를 했고 상대가 액션 영화를 좋아한다고 말했어.'
          for name,advanced in [('starter_normal',False),('starter_advanced',True)]:
              d,sec=post('/api/starter',{'relation':'썸','nickname':'테스트상대','message':ctx,'tone':'자연스럽게','starterGoal':'대화를 자연스럽게 이어가기' if advanced else '부담 없이 먼저 연락하기','profile':None,'recentMemory':'','selectedSituation':'','advanced':advanced})
              print('\n===',name,sec,'s ===');print(json.dumps(d,ensure_ascii=False,indent=2))
              assert d.get('serverVersion')==V and isinstance(d.get('replies'),list) and len(d['replies'])>=3
              texts=' '.join(str(x.get('text','')) for x in d['replies'] if isinstance(x,dict))
              assert '생각났' not in texts and '어제' not in texts and ' ㅎ' not in texts and 'ㅋㅋ' not in texts and 'ㅎㅎ' not in texts
              assert not any(x in texts for x in ['토요일','일요일','다음 주','카페'])
              results.append((name,sec))

          qmsg='상대가 "오늘은 일이 좀 바빴어요. 이제 집에 왔어요"라고 했어. 뭐라고 답하면 좋을까?'
          q,sec=post('/api/love-analysis',{'relation':'썸','nickname':'테스트상대','message':qmsg,'tone':'자연스럽게','mode':'quick','advanced':False,'recentMemory':'','images':[]})
          print('\n=== reply_quick',sec,'s ===');print(json.dumps(q,ensure_ascii=False,indent=2))
          assert q.get('serverVersion')==V and isinstance(q.get('replies'),list) and len(q['replies'])==2
          assert q.get('meaning') and q.get('advice')
          allq=' '.join(str(q.get(k,'')) for k in ['meaning','emotion','flow','strategy','advice','nextAction'])
          assert not any(x in allq for x in ['호감','관심 신호','의식했','대화하고 싶은 신호','가능성이 높'])
          qt=' '.join(str(x.get('text','')) for x in q['replies'] if isinstance(x,dict))
          assert not any(x in qt for x in ['토요일','일요일','다음 주'])
          results.append(('reply_quick',sec))

          dmsg='최근에는 서로 일상 얘기를 주고받고 있고 상대도 질문을 해. 지금 흐름과 뭐라고 답하면 좋을지 자세히 봐줘.'
          deep,sec=post('/api/love-analysis',{'relation':'썸','nickname':'테스트상대','message':dmsg,'tone':'차분하고 현실적으로','mode':'detail','advanced':True,'recentMemory':'','images':[]})
          print('\n=== reply_detail',sec,'s ===');print(json.dumps(deep,ensure_ascii=False,indent=2))
          assert deep.get('serverVersion')==V and isinstance(deep.get('replies'),list) and len(deep['replies'])==2
          for k in ['meaning','emotion','strategy','caution']: assert str(deep.get(k,'')).strip(),('missing',k)
          deeps=' '.join(str(deep.get(k,'')) for k in ['meaning','emotion','flow','strategy','caution'])
          assert '호감이 높' not in deeps and '속마음은' not in deeps
          results.append(('reply_detail',sec))

          print('\nSPEED_SUMMARY',results,'avg',round(statistics.mean(x[1] for x in results),2),'max',max(x[1] for x in results))
          for name,sec in results: assert sec < 7.0,(name,'too_slow',sec)
          print('ALL_V69_TARGETED_CORE_QA_OK')
          PY
