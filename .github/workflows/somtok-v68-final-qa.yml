name: somtok-v71-actual-detail-qa

on:
  pull_request:
    branches: [main]

jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v68-final-qa'
    runs-on: ubuntu-latest
    steps:
      - name: Test v71 actual quoted detail reply
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          B='https://lovetalk-api.onrender.com'; V='2026-08-24-potentia-v71-instant-reply-core'
          with urllib.request.urlopen(B+'/api/version',timeout=20) as r: got=json.loads(r.read().decode()).get('version')
          assert got==V,(got,V)
          msg='상대가 "오늘은 일이 좀 바빴어요. 이제 집에 왔어요. 오늘은 뭐 하셨어요?"라고 했어. 속마음까지 자세히 보고 뭐라고 답할지 알려줘.'
          payload={'relation':'썸','nickname':'테스트상대','message':msg,'tone':'자연스럽고 차분하게','mode':'detail','advanced':True,'recentMemory':'','images':[]}
          req=urllib.request.Request(B+'/api/love-analysis',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
          t=time.perf_counter()
          with urllib.request.urlopen(req,timeout=20) as r:d=json.loads(r.read().decode())
          sec=round(time.perf_counter()-t,2)
          print('ELAPSED',sec);print(json.dumps(d,ensure_ascii=False,indent=2))
          assert d.get('serverVersion')==V and isinstance(d.get('replies'),list) and len(d['replies'])==2
          for k in ['meaning','emotion','strategy','caution']: assert str(d.get(k,'')).strip(),('missing',k)
          text=' '.join(str(d.get(k,'')) for k in ['meaning','emotion','flow','strategy','caution'])
          assert not any(x in text for x in ['호감이 높','분명히 좋아','고백해도','속마음은 확실','피곤해 보'])
          rep=' '.join(str(x.get('text','')) for x in d['replies'] if isinstance(x,dict))
          assert not any(x in rep for x in ['토요일','일요일','다음 주','저도 바빴','나도 바빴'])
          assert sec < 7.0,('too_slow',sec)
          print('ALL_V71_ACTUAL_DETAIL_OK',sec)
          PY
