name: somtok-v71-detail-targeted-qa

on:
  pull_request:
    branches: [main]

jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v68-final-qa'
    runs-on: ubuntu-latest
    steps:
      - name: Retest v71 detail summary only
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          B='https://lovetalk-api.onrender.com'; V='2026-08-24-potentia-v71-instant-reply-core'
          with urllib.request.urlopen(B+'/api/version',timeout=20) as r: got=json.loads(r.read().decode()).get('version')
          print('SERVER_VERSION',got); assert got==V,(got,V)
          msg='최근에는 서로 일상 얘기를 주고받고 있고 상대도 질문을 해. 지금 흐름과 뭐라고 답하면 좋을지 자세히 봐줘.'
          payload={'relation':'썸','nickname':'테스트상대','message':msg,'tone':'차분하고 현실적으로','mode':'detail','advanced':True,'recentMemory':'','images':[]}
          req=urllib.request.Request(B+'/api/love-analysis',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
          t=time.perf_counter()
          with urllib.request.urlopen(req,timeout=20) as r:d=json.loads(r.read().decode())
          sec=round(time.perf_counter()-t,2)
          print('\n=== reply_detail_summary',sec,'s ===');print(json.dumps(d,ensure_ascii=False,indent=2))
          assert d.get('serverVersion')==V and d.get('replies')==[]
          for k in ['meaning','emotion','strategy','caution']: assert str(d.get(k,'')).strip(),('missing',k)
          text=' '.join(str(d.get(k,'')) for k in ['meaning','emotion','flow','strategy','caution'])
          assert not any(x in text for x in ['호감이 높','속마음은 확실','분명히 좋아','고백해도 된다'])
          assert sec < 3.0,('too_slow',sec)
          print('ALL_V71_DETAIL_SUMMARY_OK',sec)
          PY
