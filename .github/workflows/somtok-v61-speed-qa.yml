name: somtok-v66-full-pro-qa

on:
  pull_request:
    branches: [main]

jobs:
  full-test:
    if: github.event.pull_request.head.ref == 'agent/somtok-v61-speed-qa'
    runs-on: ubuntu-latest
    steps:
      - name: Test v66 speed and grounded PRO quality
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,statistics
          V='2026-08-23-potentia-v66-grounded-fast-pro'; B='https://lovetalk-api.onrender.com'
          with urllib.request.urlopen(B+'/api/version',timeout=20) as r: got=json.loads(r.read().decode()).get('version')
          print('SERVER_VERSION',got); assert got==V,(got,V)
          cases=[
            ('confession','[PRO 고백 타이밍] 최근에는 서로 일상 이야기를 주고받고 있고 상대도 질문을 해. 고백하기 좋은 흐름인지 봐줘.'),
            ('date','[PRO 데이트 타이밍] 대화가 자연스럽게 이어지고 있고 상대가 영화 이야기를 했어. 약속 제안 시점을 봐줘.'),
            ('risk','[PRO 위험 신호 감지] 상대가 답장을 재촉하는 말을 가끔 해. 아직 반복되는지는 모르겠어. 과장 없이 점검해줘.'),
            ('risk_password','[PRO 위험 신호 감지] 상대가 내 SNS 비밀번호를 알려달라고 계속 요구하고 내가 싫다고 했는데도 사랑하면 알려줘야 한다고 해. 어떻게 봐야 해?'),
            ('monthly','[PRO 월간 관계 리포트] 최근 30일 기록: 서로 안부 질문을 했고, 내가 먼저 연락한 날도 있으며, 상대가 주제를 이어간 날도 있었어. 행동 변화만 정리해줘.'),
            ('memory','[PRO 상대별 AI 기억 강화] 사용자가 직접 확인한 사실: 상대는 커피를 좋아한다고 말했고 최근 두 대화에서 상대가 질문을 했어. 저장할 사실과 추론을 구분해줘.'),
            ('date_grounded','[PRO 데이트 타이밍] 상대가 보드게임을 좋아한다고 직접 말했어. 나는 이번 일요일 오후가 가능해. 그 외에는 상대 취향이나 최근 상황을 몰라. 가볍게 만남 제안이 가능한지 봐줘.')
          ]
          times={};outs={}
          for name,msg in cases:
            payload={'relation':'썸','nickname':'테스트상대','message':msg,'tone':'차분하고 현실적으로','mode':'detail','advanced':True,'recentMemory':'','images':[]}
            req=urllib.request.Request(B+'/api/love-analysis',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
            t=time.perf_counter()
            with urllib.request.urlopen(req,timeout=35) as r:d=json.loads(r.read().decode())
            sec=round(time.perf_counter()-t,2);times[name]=sec;outs[name]=d
            print('\n===',name,sec,'s ===');print(json.dumps(d,ensure_ascii=False,indent=2))
            assert d.get('serverVersion')==V
            assert d.get('confidence') in ['높음','중간','낮음']
            assert isinstance(d.get('replies'),list)
            for k in ['meaning','emotion','flow','strategy','caution','advice','nextAction']: assert str(d.get(k,'')).strip(),(name,k)
            alltext=' '.join(str(d.get(k,'')) for k in ['meaning','emotion','flow','strategy','caution','dontSend','advice','nextAction'])
            rep=' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
            assert not any(x in alltext for x in ['2~3일','2~3주']), (name,'invented_period',alltext)
            assert '[답변]' not in rep and '○○' not in rep,(name,'placeholder')
          # Common paths now return without model wait.
          for name in ['confession','date','risk','risk_password','memory','date_grounded']:
            assert times[name] < 3.0,(name,'instant path too slow',times[name])
          confession=' '.join(str(outs['confession'].get(k,'')) for k in outs['confession'])
          assert '카톡' not in confession and '카카오톡' not in confession and '채팅' not in confession
          assert outs['confession']['replies']==[]
          date_rep=' '.join(str(x.get('text','')) for x in outs['date']['replies'] if isinstance(x,dict))
          assert len(outs['date']['replies'])==3
          assert not any(x in date_rep for x in ['다음 주','토요일','일요일','저도','보여줘','스크린샷'])
          date_all=' '.join(str(outs['date'].get(k,'')) for k in outs['date'])
          assert '호감 신호' not in date_all and '관심 신호' not in date_all
          risk_all=' '.join(str(outs['risk'].get(k,'')) for k in outs['risk'])
          assert outs['risk']['replies']==[]
          assert '관심 신호로 환산하지 않습니다' in risk_all
          assert '3~4회' not in risk_all and '호기심' not in risk_all
          pw=' '.join(str(outs['risk_password'].get(k,'')) for k in outs['risk_password'])
          assert outs['risk_password']['replies']==[] and '비밀번호' in pw and ('공유하지' in pw or '넘기' in pw)
          assert outs['monthly']['replies']==[] and outs['memory']['replies']==[]
          mem=' '.join(str(outs['memory'].get(k,'')) for k in outs['memory'])
          assert '관심의 신호일 수' not in mem and '대화 지속 의지' not in mem
          dg=' '.join(str(x.get('text','')) for x in outs['date_grounded']['replies'] if isinstance(x,dict))
          assert len(outs['date_grounded']['replies'])==3
          assert '보드게임' in dg and '일요일' in dg
          assert not any(x in dg for x in ['토요일','다음 주','카페','매장'])
          vals=list(times.values())
          assert max(vals) < 15.0,('overall too slow',times)
          print('\nSPEED_SUMMARY',times,'avg',round(statistics.mean(vals),2),'median',round(statistics.median(vals),2),'max',max(vals))
          print('ALL_V66_FULL_PRO_CHECKS_OK')
          PY
