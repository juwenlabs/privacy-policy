name: somtok-v64-targeted-pro-qa

on:
  pull_request:
    branches: [main]

jobs:
  targeted-test:
    if: github.event.pull_request.head.ref == 'agent/somtok-v61-speed-qa'
    runs-on: ubuntu-latest
    steps:
      - name: Retest only v63 failures on v64
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          V='2026-08-23-potentia-v64-compact-pro-grounded'; B='https://lovetalk-api.onrender.com'
          with urllib.request.urlopen(B+'/api/version',timeout=20) as r: got=json.loads(r.read().decode()).get('version')
          print('SERVER_VERSION',got); assert got==V,(got,V)
          cases=[
            ('confession','[PRO 고백 타이밍] 최근에는 서로 일상 이야기를 주고받고 있고 상대도 질문을 해. 고백하기 좋은 흐름인지 봐줘.'),
            ('date','[PRO 데이트 타이밍] 대화가 자연스럽게 이어지고 있고 상대가 영화 이야기를 했어. 약속 제안 시점을 봐줘.'),
            ('risk','[PRO 위험 신호 감지] 상대가 답장을 재촉하는 말을 가끔 해. 아직 반복되는지는 모르겠어. 과장 없이 점검해줘.')
          ]
          for name,msg in cases:
            payload={'relation':'썸','nickname':'테스트상대','message':msg,'tone':'차분하고 현실적으로','mode':'detail','advanced':True,'recentMemory':'','images':[]}
            req=urllib.request.Request(B+'/api/love-analysis',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
            t=time.perf_counter()
            with urllib.request.urlopen(req,timeout=35) as r:d=json.loads(r.read().decode())
            sec=round(time.perf_counter()-t,2); print('\n===',name,sec,'s ===');print(json.dumps(d,ensure_ascii=False,indent=2))
            assert d.get('serverVersion')==V
            assert d.get('confidence') in ['높음','중간','낮음']
            assert isinstance(d.get('replies'),list)
            alltext=' '.join(str(d.get(k,'')) for k in ['meaning','emotion','flow','strategy','caution','dontSend','advice','nextAction'])
            rep=' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
            if name=='confession':
              assert '카톡' not in alltext and '카카오톡' not in alltext,(name,'invented_channel',alltext)
            elif name=='date':
              assert not any(x in rep for x in ['보여줄 수','보여줘','메시지 전문','스크린샷','공유해']), (name,'meta_reply',rep)
              assert not any(x in rep for x in ['다음 주','토요일','일요일','저도']), (name,'invented_reply',rep)
            elif name=='risk':
              assert '2~3주' not in alltext and '2~3일' not in alltext,(name,'invented_period',alltext)
              assert d.get('replies')==[],(name,'analysis_only_should_not_reply',d.get('replies'))
              assert '요즘 바빠서' not in rep and '생각 정리 중' not in rep
          print('\nALL_V64_TARGETED_CHECKS_OK')
          PY
