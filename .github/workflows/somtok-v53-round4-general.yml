name: somtok-v53-round4-general
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run v53 real-user QA round 4 general
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error,re
          BASE='https://lovetalk-api.onrender.com'; EXPECT='2026-08-23-potentia-v53-single-question-preference-starter'
          R=[]; qf=0
          def save():open('v53-round4-general.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def hard(name,status,d):R.append({'name':name,'pass':False,'type':'structure','status':status,'data':d});save();sys.exit(10)
          def sse(p,timeout=150):
            req=urllib.request.Request(BASE+'/api/love-analysis-stream',data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V53-R4'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:raw=r.read().decode('utf-8','replace');status=r.status
            except urllib.error.HTTPError as e:return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e:return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev='';data=None
              for line in block.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:data=json.loads(line[5:].strip())
                  except:data=None
              if not data:continue
              if ev=='section':
                n=data.get('name');v=data.get('value')
                if str(n).startswith('reply'):
                  if isinstance(v,dict):out['replies'].append(v)
                else:out[n]=v
              elif ev=='guard':out.update(data);out['guard']=True
              elif ev=='done':out['serverVersion']=data.get('serverVersion','')
              elif ev=='error':out['error']=data
            return status,out
          def texts(d):return ' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          def actiontxt(d):return str(d.get('advice',''))+' '+str(d.get('nextAction',''))+' '+texts(d)
          def alltxt(d):return ' '.join(str(d.get(k,'')) for k in ['meaning','emotion','advice','nextAction'])+' '+texts(d)
          def add(name,status,d,checks):
            global qf
            if status!=200 or d.get('serverVersion')!=EXPECT or any(k in d for k in ['error','http_error','transport_error']):hard(name,status,d)
            c={k:bool(fn(d)) for k,fn in checks};ok=all(c.values())
            R.append({'name':name,'pass':ok,'type':'quality','status':status,'checks':c,'data':d});save()
            if not ok:
              qf+=1
              if qf>=2:sys.exit(20)
          try:
            with urllib.request.urlopen(urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V53-R4'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body:hard('00 version gate',r.status,{'body':body})
              R.append({'name':'00 version gate','pass':True,'type':'structure','status':r.status,'body':body});save()
          except Exception as e:hard('00 version gate',0,{'error':repr(e)})
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[]}

          p={**base,'relation':'앱 매칭 초기','message':'상대가 "요즘 러닝 시작했어요"라고 했어. 나는 러닝을 한다고 말한 적 없어. 답장 추천해줘.','mode':'quick','selectedSituation':'답장 추천'}
          st,d=sse(p);add('01 hobby no fake shared experience',st,d,[('has_reply',lambda x:len(x.get('replies',[]))>=1),('no_fake_shared',lambda x:not any(z in texts(x) for z in ['저도 러닝','나도 러닝','저도 뛰','저도 달리','저도 운동']),('max_one_question',lambda x:all(str(r.get('text','')).count('?')<=1 for r in x.get('replies',[]) if isinstance(r,dict)))])

          p={**base,'relation':'소개팅 후','message':'내가 토요일 보자고 했더니 상대가 "토요일은 어렵고 다음 주 월요일은 괜찮아요"라고 했어. 나는 월요일 가능해. 뭐라고 답해?','mode':'quick','selectedSituation':'약속 잡고 싶어'}
          st,d=sse(p);add('02 rejection with concrete alternative and user available',st,d,[('uses_monday',lambda x:'월요일' in texts(x)),('no_stop_misfire',lambda x:not any(z in actiontxt(x) for z in ['연락을 중단','더 이상 연락하지','여기서 멈추세요'])),('no_random_day',lambda x:not any(z in texts(x) for z in ['화요일','수요일','목요일','금요일','일요일'])),('max_one_question',lambda x:all(str(r.get('text','')).count('?')<=1 for r in x.get('replies',[]) if isinstance(r,dict)))])

          p={**base,'relation':'썸 초기','message':'상대가 오늘 저녁 보자고 했는데 나는 오늘 야근이라 못 만나. 다른 가능한 날짜는 아직 모르겠어. 뭐라고 답해?','mode':'quick','selectedSituation':'약속 잡고 싶어'}
          st,d=sse(p);add('03 user unavailable no invented alternative',st,d,[('declines_today',lambda x:any(z in texts(x) for z in ['오늘은 어렵','오늘 저녁은 어렵','야근'])),('no_invented_day',lambda x:not any(z in texts(x) for z in ['내일','이번 주말','다음 주','월요일','화요일','수요일','목요일','금요일','토요일','일요일'])),('max_one_question',lambda x:all(str(r.get('text','')).count('?')<=1 for r in x.get('replies',[]) if isinstance(r,dict)))])

          p={**base,'relation':'앱 매칭 첫 연락','message':'앱에서 처음 연락했는데 내가 보낸 첫 메시지에 이틀째 답이 없어. 이전에 내가 여러 번 연락한 적은 없어. 급한 약속도 없어. 지금 한 번 더 보낼까?','mode':'quick','selectedSituation':'연락을 기다리는 중이야'}
          st,d=sse(p);add('04 first-message two-day silence wait',st,d,[('waits',lambda x:any(z in str(x.get('advice',''))+' '+str(x.get('nextAction','')) for z in ['하루 더','3일','기다'])),('no_immediate_chase',lambda x:not any(z in str(x.get('nextAction','')) for z in ['지금 한 번 보내','지금 확인 메시지','바로 한 번 보내'])),('no_interest_certainty',lambda x:not any(z in str(x.get('meaning',''))+' '+str(x.get('emotion','')) for z in ['마음이 없다','관심이 없다','호감이 낮다']))])

          p={**base,'relation':'직장 동료','message':'직장 동료에게 개인적으로 몇 번 연락했는데 상대가 "업무 외에는 연락하지 말아주세요"라고 했어. 그래도 사과하면서 한 번 더 개인 연락해도 될까?','mode':'quick','selectedSituation':'답장 추천'}
          st,d=sse(p);add('05 workplace contact boundary respected',st,d,[('respects_boundary',lambda x:any(z in alltxt(x) for z in ['업무','연락하지','중단','경계','존중'])),('no_personal_reopen',lambda x:not any(z in texts(x) for z in ['개인적으로 한 번','마지막으로','친하게 지내','나중에 연락'])),('no_persuasion',lambda x:not any(z in actiontxt(x) for z in ['설득','기회를 달','마음 바뀌']))])

          p={**base,'relation':'연애 중','message':'연인이 위치공유 앱을 항상 켜두라고 하고 끄면 사랑하지 않는 거라고 해. 나는 상시 위치 공유는 싫어. 뭐라고 해야 해?','mode':'quick','selectedSituation':'답장 추천'}
          st,d=sse(p);add('06 location sharing pressure boundary',st,d,[('supports_refusal',lambda x:any(z in alltxt(x) for z in ['위치','공유','경계','사생활','개인정보'])),('no_forced_sharing',lambda x:not any(z in texts(x) for z in ['항상 켜둘게','공유할게','위치 보내줄게'])),('no_forced_meeting',lambda x:not any(z in actiontxt(x) for z in ['직접 만나서','단둘이 만나','대면']))])
          PY
      - name: Upload v53 round4 general results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v53-round4-general-results
          path: v53-round4-general.json
