name: somtok-v78-openai-qa

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qa:
    if: github.event.head_commit.message == 'Add temporary Somtok v78 OpenAI QA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test v78 production
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request
          B='https://lovetalk-api.onrender.com'; V='2026-08-24-potentia-v78-openai-schedule-guard'
          with urllib.request.urlopen(B+'/api/version',timeout=20) as r:
              got=json.loads(r.read().decode()).get('version')
          assert got==V,(got,V)
          def post(message,mode='quick',detail=False):
              p={'relation':'썸','nickname':'테스트상대','message':message,'tone':'자연스럽게','mode':mode,'advanced':detail,'replyDetailMode':detail,'recentMemory':'','images':[]}
              req=urllib.request.Request(B+'/api/love-analysis',data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
              t=time.perf_counter()
              with urllib.request.urlopen(req,timeout=50) as r:d=json.loads(r.read().decode())
              return d,round(time.perf_counter()-t,2)
          tests=[
            ('quick_plain','내일 뭐해?','quick',False),
            ('quick_dialogue','상대: 내일 뭐해?\n나: 아직 답장 안 함','quick',False),
            ('detail_plain','내일 뭐해?','detail',True),
            ('detail_dialogue','상대: 내일 뭐해?\n나: 아직 답장 안 함','detail',True),
            ('polite','상대: 내일 뭐 하세요?\n나: 아직 답장 안 함','quick',False),
            ('openai_generic','상대가 오늘 일이 많아서 정신없었다고 했어. 아직 답장 안 했어.','quick',False),
          ]
          banned=['평일이라','쉽지 않을','바쁠 것','약속 없어','약속은 없어','계획 없어','계획은 없어','비어 있어','정해진 게 없어','정해진 건 없어']
          cases=[]; ok=True
          for name,msg,mode,detail in tests:
              try:
                  d,sec=post(msg,mode,detail); replies=d.get('replies') or []; texts=[str(x.get('text','')) for x in replies]
                  issues=[] if name=='openai_generic' else [x for x in banned if x in ' '.join(texts)]
                  if len(replies)!=3 or issues: ok=False
                  cases.append({'name':name,'seconds':sec,'replyCount':len(replies),'texts':texts,'issues':issues,'response':d})
                  print(name,sec,texts,issues)
              except Exception as e:
                  ok=False; cases.append({'name':name,'error':repr(e)})
          result={'status':'PASS' if ok else 'FAIL','version':V,'cases':cases}
          open('somtok-v78-openai-diagnostic.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not ok: raise SystemExit(1)
          PY
      - name: Save result and cleanup
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/somtok-v78-openai-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add somtok-v78-openai-diagnostic.json .github/workflows/somtok-v78-openai-qa.yml || true
          git commit -m "Record Somtok v78 OpenAI QA" || true
          git push origin HEAD:main
