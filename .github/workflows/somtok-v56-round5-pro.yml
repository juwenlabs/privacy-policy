name: somtok-v56-round5-pro
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run v56 round5 PRO QA
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'
          EXPECT='2026-08-23-potentia-v56-unknown-date-block-bypass'
          R=[]
          def save():
            open('v56-round5-pro.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def sse(path,p,timeout=190):
            req=urllib.request.Request(BASE+path,data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V56-R5-PRO'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:
                raw=r.read().decode('utf-8','replace');status=r.status
            except urllib.error.HTTPError as e:
              return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e:
              return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev='';data=None
              for line in block.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:data=json.loads(line[5:].strip())
                  except:data=None
              if not data:continue
              if ev=='section':
                n=data.get('name');v=data.get('value')
                if str(n).startswith('reply'):
                  if isinstance(v,dict):out['replies'].append(v)
                else:out[n]=v
              elif ev=='guard':out.update(data);out['guard']=True
              elif ev=='done':out['serverVersion']=data.get('serverVersion','')
              elif ev=='error':out['error']=data
            return status,out
          def texts(d):
            return ' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          def structure_ok(status,d):
            return status==200 and d.get('serverVersion')==EXPECT and not any(k in d for k in ['error','http_error','transport_error'])
          try:
            with urllib.request.urlopen(urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V56-R5-PRO'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body:
                R.append({'name':'00 version','pass':False,'type':'structure','status':r.status,'body':body});save();sys.exit(10)
          except Exception as e:
            R.append({'name':'00 version','pass':False,'type':'structure','error':repr(e)});save();sys.exit(10)
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'images':[]}

          p={**base,'relation':'썸 초기','recentMemory':'이전 AI 추정: 상대가 나를 좋아하는 것 같고 적극적일 수 있음. 이것은 AI가 만든 추정임.','message':'확인된 사실은 최근 4번 대화 중 내가 3번 먼저 시작했고 상대가 먼저 시작한 건 1번이야. 상대는 답장은 했지만 약속을 제안한 적은 없어. 지금 관계를 상세히 봐줘.','mode':'detail','selectedSituation':'썸인지 헷갈려'}
          st,d=sse('/api/love-analysis-stream',p)
          if not structure_ok(st,d):
            R.append({'name':'01 PRO memory inference does not outrank facts','pass':False,'type':'structure','status':st,'data':d});save();sys.exit(10)
          core=' '.join(str(d.get(k,'')) for k in ['meaning','emotion','flow','advice','nextAction'])
          action=str(d.get('advice',''))+' '+str(d.get('nextAction',''))+' '+texts(d)
          checks={
            'has_confidence':d.get('confidence') in ['높음','중간','낮음'],
            'recognizes_user_more_initiation':any(z in core for z in ['3번','사용자가 더','선연락이 사용자','사용자 쪽','불균형']),
            'no_memory_certainty':not any(z in str(d.get('meaning',''))+' '+str(d.get('emotion','')) for z in ['호감이 확실','썸이 확실','상대가 좋아한다','적극적이라고 볼 수','호감이 높다']),
            'no_more_user_push':not any(z in action for z in ['사용자가 먼저 연락을 이어','사용자가 한 번 더 연락','지금 한 번 더 보내','먼저 연락해보세요']),
            'no_invented_schedule':not any(z in texts(d) for z in ['이번 주','다음 주','주말','월요일','화요일','수요일','목요일','금요일','토요일','일요일'])
          }
          ok=all(checks.values());R.append({'name':'01 PRO memory inference does not outrank facts','pass':ok,'type':'quality','status':st,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)

          p={**base,'relation':'두 번 대화한 사이','recentMemory':'','message':'상대가 보드게임을 좋아한다고 직접 말했어. 나는 이번 일요일 오후가 가능해. 그 외에는 상대 취향이나 최근 상황을 몰라.','starterGoal':'가볍게 다음 만남 제안','advanced':True,'selectedSituation':'약속 잡고 싶어'}
          st,d=sse('/api/starter-stream',p)
          if not structure_ok(st,d):
            R.append({'name':'02 PRO advanced starter boardgame grounded','pass':False,'type':'structure','status':st,'data':d});save();sys.exit(10)
          t=texts(d)
          checks={
            'three_replies':len(d.get('replies',[]))==3,
            'uses_preference':all('보드게임' in str(r.get('text','')) for r in d.get('replies',[]) if isinstance(r,dict)),
            'uses_availability':all('일요일' in str(r.get('text','')) for r in d.get('replies',[]) if isinstance(r,dict)),
            'no_fake_shared':not any(z in t for z in ['저도 보드게임','나도 보드게임','같이 했던','지난번 보드게임']),
            'no_fake_place':not any(z in t for z in ['보드게임카페','보드게임 카페','카페','게임방']),
            'no_fake_thought':not any(z in t for z in ['생각나서','생각났','문득','떠올라서']),
            'no_weather':'날씨' not in t,
            'max_one_question':all(str(r.get('text','')).count('?')<=1 for r in d.get('replies',[]) if isinstance(r,dict))
          }
          ok=all(checks.values());R.append({'name':'02 PRO advanced starter boardgame grounded','pass':ok,'type':'quality','status':st,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)
          PY
      - name: Upload v56 round5 PRO results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v56-round5-pro-results
          path: v56-round5-pro.json
