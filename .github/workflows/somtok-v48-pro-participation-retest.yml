name: somtok-v48-pro-participation-retest
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retest v48 PRO participation balance
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'; EXPECT='2026-08-23-potentia-v48-pro-participation-balance'
          R=[]
          def save():open('v48-pro.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def hard(name,status,d):R.append({'name':name,'pass':False,'type':'structure','status':status,'data':d});save();sys.exit(10)
          def sse(p,timeout=140):
            req=urllib.request.Request(BASE+'/api/love-analysis-stream',data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V48-PRO'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:raw=r.read().decode('utf-8','replace');status=r.status
            except urllib.error.HTTPError as e:return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e:return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev='';data=None
              for line in block.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:data=json.loads(line[5:].strip())
                  except:data=None
              if not data:continue
              if ev=='section':
                n=data.get('name');v=data.get('value')
                if str(n).startswith('reply'):
                  if isinstance(v,dict):out['replies'].append(v)
                else:out[n]=v
              elif ev=='done':out['serverVersion']=data.get('serverVersion','')
              elif ev=='error':out['error']=data
            return status,out
          def texts(d):return ' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          def actiontxt(d):return str(d.get('advice',''))+' '+str(d.get('nextAction',''))+' '+texts(d)
          try:
            with urllib.request.urlopen(urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V48-PRO'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body:hard('00 version gate',r.status,{'body':body})
              R.append({'name':'00 version gate','pass':True,'type':'structure','status':r.status,'body':body});save()
          except Exception as e:hard('00 version gate',0,{'error':repr(e)})
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[]}
          p={**base,'relation':'썸 초기','message':'최근 세 번 답장은 빠르게 왔지만 상대가 먼저 연락한 적은 없어. 질문은 가끔 하나씩 하고, 나는 두 번 먼저 연락했어. 아직 약속 제안은 서로 없었어. 썸인지 상세히 봐줘.','mode':'detail','selectedSituation':'썸인지 헷갈려'}
          st,d=sse(p)
          if st!=200 or d.get('serverVersion')!=EXPECT or any(k in d for k in ['error','http_error','transport_error']):hard('01 PRO mixed participation',st,d)
          checks={
            'no_replies':len(d.get('replies',[]))==0,
            'wait_counterpart':any(z in actiontxt(d) for z in ['상대가 먼저','자발적 참여','새 메시지를 보내지']),
            'no_fake_feeling':not any(z in texts(d) for z in ['좋네요','좋아요 ㅎㅎ','기분 좋']),
            'no_continue_user_opening':not any(z in actiontxt(d) for z in ['사용자가 연락을 이어가','한 번 더 연락','오늘 하루는 어땠','요즘 뭐 하고'])
          }
          ok=all(checks.values())
          R.append({'name':'01 PRO mixed participation','pass':ok,'type':'quality','status':st,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)
          PY
      - name: Upload v48 PRO result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v48-pro-result
          path: v48-pro.json
