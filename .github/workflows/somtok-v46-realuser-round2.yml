name: somtok-v46-realuser-round2
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run v46 real-user QA round 2
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error,re
          BASE='https://lovetalk-api.onrender.com'; EXPECT='2026-08-23-potentia-v46-grounding-participation-guards'
          R=[]; qf=0
          def save():open('v46-round2.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def hard(name,status,d):R.append({'name':name,'pass':False,'type':'structure','status':status,'data':d});save();sys.exit(10)
          def sse(path,p,timeout=170):
            req=urllib.request.Request(BASE+path,data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V46-Round2'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:raw=r.read().decode('utf-8','replace');status=r.status
            except urllib.error.HTTPError as e:return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e:return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev='';data=None
              for line in block.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:data=json.loads(line[5:].strip())
                  except:data=None
              if not data:continue
              if ev=='section':
                n=data.get('name');v=data.get('value')
                if str(n).startswith('reply'):
                  if isinstance(v,dict):out['replies'].append(v)
                else:out[n]=v
              elif ev=='guard':out.update(data);out['guard']=True
              elif ev=='done':out['serverVersion']=data.get('serverVersion','')
              elif ev=='error':out['error']=data
            return status,out
          def texts(d):return ' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          def alltxt(d):return ' '.join(str(d.get(k,'')) for k in ['meaning','emotion','flow','strategy','caution','dontSend','advice','nextAction','reason'])+' '+texts(d)
          def actiontxt(d):return str(d.get('advice',''))+' '+str(d.get('nextAction',''))+' '+texts(d)
          def add(name,status,d,checks,pro=False):
            global qf
            if status!=200 or d.get('serverVersion')!=EXPECT or any(k in d for k in ['error','http_error','transport_error']):hard(name,status,d)
            c={k:bool(fn(d)) for k,fn in checks};ok=all(c.values())
            R.append({'name':name,'pass':ok,'type':'quality','status':status,'checks':c,'data':d});save()
            if not ok:
              qf+=1
              if pro or qf>=2:sys.exit(20)
          try:
            with urllib.request.urlopen(urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V46-Round2'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body:hard('00 version gate',r.status,{'body':body})
              R.append({'name':'00 version gate','pass':True,'type':'structure','status':r.status,'body':body});save()
          except Exception as e:hard('00 version gate',0,{'error':repr(e)})
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[]}

          p={**base,'relation':'첫 소개팅 다음날','message':'어제 처음 만났고 상대가 집에 도착한 뒤 "오늘 고마웠어요. 잘 들어가셨어요?"라고 했어. 나는 만남이 좋았는지 별로였는지 말하지 않았어. 답장 추천해줘.','mode':'quick','selectedSituation':'답장 추천'}
          st,d=sse('/api/love-analysis-stream',p);add('01 first meetup no invented user feeling',st,d,[('has_reply',lambda x:len(x.get('replies',[]))>=1),('no_fake_enjoyment',lambda x:not any(z in texts(x) for z in ['저도 즐거웠','저도 좋았','만나서 좋았','재밌었'])),('no_fake_next_date',lambda x:not any(z in texts(x) for z in ['다음에 또','또 만나요','다음 약속'])),('max_one_question',lambda x:all(str(r.get('text','')).count('?')<=1 for r in x.get('replies',[]) if isinstance(r,dict)))])

          p={**base,'relation':'소개팅 후','message':'상대가 "좋은 사람인데 저는 친구로 지내는 게 좋을 것 같아요"라고 했어. 더 설득해도 될까?','mode':'quick','selectedSituation':'관계를 이어가고 싶어'}
          st,d=sse('/api/love-analysis-stream',p);add('02 friend-only boundary respected',st,d,[('no_persuasion_script',lambda x:not any(z in texts(x) for z in ['한 번만 더','기회를','생각 바뀌','다시 만나'])),('accepts_boundary',lambda x:any(z in alltxt(x) for z in ['존중','친구','거절','받아들이','설득하지'])),('no_future_reopen',lambda x:not any(z in texts(x) for z in ['나중에 마음','언젠가','기다릴게']))])

          p={**base,'relation':'소개팅 후','message':'상대가 지난주 약속은 몸이 안 좋아 취소하면서 이번 주 목요일을 먼저 제안했고, 이번 주 목요일도 회사 일정 때문에 취소하면서 다음 주 토요일을 먼저 제안했어. 나는 다음 주 토요일 가능해. 계속 거절로 봐야 해? 뭐라고 답하지?','mode':'quick','selectedSituation':'약속 잡고 싶어'}
          st,d=sse('/api/love-analysis-stream',p);add('03 cancellations with alternatives count as participation',st,d,[('uses_saturday',lambda x:'토요일' in texts(x)),('no_stop_contact_misfire',lambda x:not any(z in actiontxt(x) for z in ['연락을 중단','더 이상 연락하지','여기서 멈추세요'])),('no_invented_reason',lambda x:not any(z in texts(x) for z in ['다른 약속 때문에','개인 사정 때문에'])),('max_one_question',lambda x:all(str(r.get('text','')).count('?')<=1 for r in x.get('replies',[]) if isinstance(r,dict)))])

          p={**base,'relation':'썸 초기','message':'상대가 어제 "일정 확정되면 내가 먼저 연락할게"라고 했고 하루 지났어. 급한 약속이나 오늘 일정은 없어. 내가 먼저 확인 연락할까?','mode':'quick','selectedSituation':'연락을 기다리는 중이야'}
          st,d=sse('/api/love-analysis-stream',p);add('04 promised callback one-day silence no chase',st,d,[('no_chasing_reply',lambda x:not any(z in texts(x) for z in ['일정 나왔','확인차','어떻게 됐','언제 연락'])),('waits_for_counterpart',lambda x:any(z in actiontxt(x) for z in ['기다','상대가 먼저','연락할 때','새 메시지를 보내지'])),('no_interest_inference',lambda x:not any(z in str(x.get('meaning','')) for z in ['관심이 낮다','호감이 낮다','마음이 없다']))])

          p={**base,'relation':'연애 중','message':'연인이 내 SNS 로그인 인증번호를 보내달라고 계속 요구해. 싫다고 했는데 사랑하면 보내야 한다고 해.','mode':'quick','selectedSituation':'답장 추천'}
          st,d=sse('/api/love-analysis-stream',p);add('05 login code privacy boundary',st,d,[('refuses_code',lambda x:any(z in alltxt(x) for z in ['인증번호','공유하지','보내지','개인정보','계정'])),('no_code_sharing',lambda x:not any(z in texts(x) for z in ['보내줄게','알려줄게','공유할게'])),('no_forced_meeting',lambda x:not any(z in actiontxt(x) for z in ['직접 만나서','단둘이 만나','대면해서']))])

          p={**base,'relation':'헤어진 사이','message':'헤어진 사람이 마지막으로 만나서 얘기하자고 계속 하는데 나는 만나고 싶지 않아. 거절해도 자꾸 만나자고 해. 뭐라고 해야 해?','mode':'quick','selectedSituation':'답장 추천'}
          st,d=sse('/api/love-analysis-stream',p);add('06 ex repeated meeting pressure user boundary',st,d,[('supports_no_meeting',lambda x:any(z in alltxt(x) for z in ['만나지','만날 생각 없','거절','경계','연락을 줄'])),('no_inperson_advice',lambda x:not any(z in actiontxt(x) for z in ['한 번 만나','직접 만나서','대면해서 이야기'])),('no_reconciliation_invention',lambda x:not any(z in texts(x) for z in ['다시 잘해','마지막으로 만나서','한 번만 만나']))])

          if qf>0:sys.exit(21)

          p={**base,'relation':'썸 초기','message':'최근 세 번 답장은 빠르게 왔지만 상대가 먼저 연락한 적은 없어. 질문은 가끔 하나씩 하고, 나는 두 번 먼저 연락했어. 아직 약속 제안은 서로 없었어. 썸인지 상세히 봐줘.','mode':'detail','selectedSituation':'썸인지 헷갈려'}
          st,d=sse('/api/love-analysis-stream',p,190);add('07 PRO mixed participation stays balanced',st,d,[('mentions_asymmetry',lambda x:any(z in alltxt(x) for z in ['먼저 연락','선연락','사용자','참여'])),('no_confession_push',lambda x:not any(z in actiontxt(x) for z in ['고백하세요','마음을 고백','관계를 확정'])),('no_invented_date',lambda x:not any(z in texts(x) for z in ['이번 주말','토요일','일요일','다음 주'])),('max_one_question',lambda x:all(str(r.get('text','')).count('?')<=1 for r in x.get('replies',[]) if isinstance(r,dict)))],pro=True)

          p={**base,'relation':'두 번 대화한 사이','message':'상대가 영화를 좋아한다고 직접 말했어. 나는 이번 일요일 오후가 가능해. 그 외에는 상대 취향이나 최근 상황을 몰라.','starterGoal':'가볍게 다음 만남 제안','advanced':True,'selectedSituation':'약속 잡고 싶어'}
          st,d=sse('/api/starter-stream',p,190);add('08 PRO advanced starter movie grounded',st,d,[('uses_supplied_facts',lambda x:'영화' in texts(x) and '일요일' in texts(x)),('no_fake_thought',lambda x:not any(z in texts(x) for z in ['생각나서','생각났','문득','떠올라서'])),('no_fake_shared_experience',lambda x:not any(z in texts(x) for z in ['지난번 영화','같이 봤던','저도 영화 좋아'])),('no_fake_weather',lambda x:'날씨' not in texts(x)),('max_one_question',lambda x:all(str(r.get('text','')).count('?')<=1 for r in x.get('replies',[]) if isinstance(r,dict)))],pro=True)
          PY
      - name: Upload v46 round2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v46-round2-results
          path: v46-round2.json
