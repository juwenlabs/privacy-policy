name: somtok-v54-targeted-retest
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retest v54 unavailable and work boundary cases
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'
          EXPECT='2026-08-23-potentia-v54-unavailable-boundary-priority'
          R=[]
          def save():
            open('v54-targeted.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def hard(name,status,d):
            R.append({'name':name,'pass':False,'type':'structure','status':status,'data':d});save();sys.exit(10)
          def sse(p,timeout=120):
            req=urllib.request.Request(BASE+'/api/love-analysis-stream',data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V54-Targeted'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:
                raw=r.read().decode('utf-8','replace');status=r.status
            except urllib.error.HTTPError as e:
              return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e:
              return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev='';data=None
              for line in block.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:data=json.loads(line[5:].strip())
                  except:data=None
              if not data:continue
              if ev=='section':
                n=data.get('name');v=data.get('value')
                if str(n).startswith('reply'):
                  if isinstance(v,dict):out['replies'].append(v)
                else:out[n]=v
              elif ev=='done':out['serverVersion']=data.get('serverVersion','')
              elif ev=='error':out['error']=data
            return status,out
          def reply_text(d):
            return ' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          try:
            with urllib.request.urlopen(urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V54-Targeted'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body:hard('00 version gate',r.status,{'body':body})
              R.append({'name':'00 version gate','pass':True,'type':'structure','status':r.status,'body':body});save()
          except Exception as e:
            hard('00 version gate',0,{'error':repr(e)})
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[]}

          p={**base,'relation':'썸 초기','message':'상대가 오늘 저녁 보자고 했는데 나는 오늘 야근이라 못 만나. 다른 가능한 날짜는 아직 모르겠어. 뭐라고 답해?','mode':'quick','selectedSituation':'약속 잡고 싶어'}
          st,d=sse(p)
          if st!=200 or d.get('serverVersion')!=EXPECT or any(k in d for k in ['error','http_error','transport_error']):hard('01 unavailable unknown alternative',st,d)
          t=reply_text(d)
          a=str(d.get('advice',''))+' '+str(d.get('nextAction',''))
          checks={
            'declines_today':('오늘' in t and ('어려' in t or '야근' in t)),
            'no_invented_future_day':not any(z in t for z in ['내일','다음 주','다음주','월요일','화요일','수요일','목요일','금요일','토요일','일요일']),
            'no_fake_emotion':not any(z in t for z in ['아쉽','미안']),
            'no_fixed_followup':not any(z in a for z in ['2~3일','2-3일','3일 뒤','며칠 뒤','하루이틀']),
            'max_one_question':all(str(r.get('text','')).count('?')<=1 for r in d.get('replies',[]) if isinstance(r,dict))
          }
          ok=all(checks.values())
          R.append({'name':'01 unavailable unknown alternative','pass':ok,'type':'quality','status':st,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)

          p={**base,'relation':'직장 동료','message':'직장 동료에게 개인적으로 몇 번 연락했는데 상대가 "업무 외에는 연락하지 말아주세요"라고 했어. 그래도 사과하면서 한 번 더 개인 연락해도 될까?','mode':'quick','selectedSituation':'답장 추천'}
          st,d=sse(p)
          if st!=200 or d.get('serverVersion')!=EXPECT or any(k in d for k in ['error','http_error','transport_error']):hard('02 work-only contact boundary',st,d)
          t=reply_text(d)
          a=str(d.get('advice',''))+' '+str(d.get('nextAction',''))
          checks={
            'no_personal_reply':len(d.get('replies',[]))==0,
            'work_only':any(z in a for z in ['업무','업무 채널','개인 연락']),
            'no_apology_message':not any(z in t for z in ['죄송','미안']),
            'no_timed_reopen':not any(z in a for z in ['1주일','일주일','며칠 뒤','나중에 다시']),
            'no_planned_meeting':not any(z in a for z in ['직접 만나','따로 만나','대면해서','대면하거나'])
          }
          ok=all(checks.values())
          R.append({'name':'02 work-only contact boundary','pass':ok,'type':'quality','status':st,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)
          PY
      - name: Upload v54 targeted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v54-targeted-results
          path: v54-targeted.json
