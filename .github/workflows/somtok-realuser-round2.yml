name: somtok-realuser-round2
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Run v34 targeted retest and fresh cases
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error,re
          BASE='https://lovetalk-api.onrender.com'; EXPECT='2026-08-23-potentia-v34-balance-timing-guards'
          R=[];qfails=0
          def save():open('round2v34.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def sse(path,p,timeout=150):
            req=urllib.request.Request(BASE+path,data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-v34-QA'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:raw=r.read().decode('utf-8','replace');st=r.status
            except urllib.error.HTTPError as e:return e.code,{'http_error':e.read().decode('utf-8','replace')}
            d={'replies':[]};ver=''
            for b in raw.split('\n\n'):
              ev='';x=None
              for line in b.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:x=json.loads(line[5:].strip())
                  except:pass
              if ev=='guard' and isinstance(x,dict):d['guard']=x
              elif ev=='section' and isinstance(x,dict):
                n=x.get('name');v=x.get('value')
                if str(n).startswith('reply'):
                  i=int(str(n).replace('reply','') or 1)-1
                  while len(d['replies'])<=i:d['replies'].append(None)
                  d['replies'][i]=v
                elif n:d[n]=v
              elif ev=='done' and isinstance(x,dict):ver=x.get('serverVersion','')
              elif ev=='error':d['streamError']=x
            d['replies']=[x for x in d['replies'] if x];d['serverVersion']=ver;return st,d
          def texts(d):return ' '.join(str(x.get('text','')) if isinstance(x,dict) else str(x) for x in d.get('replies') or [])
          def rec(i,title,st,ok,d,critical=False):
            global qfails
            structural=st!=200 or bool(d.get('streamError')) or bool(d.get('http_error'))
            R.append({'id':i,'title':title,'status':st,'ok':bool(ok),'structural':structural,'response':d});save();print(('PASS' if ok else 'FAIL'),i,title)
            if structural or (critical and not ok):sys.exit(20+i)
            if not ok:
              qfails+=1
              if qfails>=2:sys.exit(40+i)
          with urllib.request.urlopen(BASE+'/api/version',timeout=30) as r:v=json.loads(r.read().decode());st=r.status
          R.append({'id':0,'title':'version','ok':st==200 and v.get('version')==EXPECT,'response':v});save()
          if st!=200 or v.get('version')!=EXPECT:sys.exit(10)
          # Four critical retests.
          st,d=sse('/api/love-analysis-stream',{'relation':'썸','nickname':'민지','message':'최근 한 달 동안 먼저 연락도 거의 제가 하고 밥 약속도 다 제가 잡았어요. 밥값도 세 번 다 제가 냈고 작은 선물도 두 번 했어요. 상대는 만나면 친절한데 먼저 연락이나 약속 제안은 거의 없어요. 더 잘해주면 가까워질까요?','tone':'자연스럽게','mode':'quick'});a=json.dumps(d,ensure_ascii=False);ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])==0 and any(x in a for x in ['행동량','줄이','자발적 참여','추가하지']) and not any(x in a for x in ['3일 뒤','먼저 인사','한 번 더 확인']);rec(1,'과투자에서 추가 선연락 중단',st,ok,d,True)
          st,d=sse('/api/love-analysis-stream',{'relation':'썸','nickname':'민지','message':'제가 보낸 카톡에는 답이 없는데 제 인스타 스토리는 두 번 봤어요. 이거 사실 관심은 있는데 일부러 답 안 하는 걸까요? 아직 후속 연락은 안 했어요.','tone':'자연스럽게','mode':'quick','selectedSituation':'읽씹 당했어'});a=json.dumps(d,ensure_ascii=False);ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])==0 and any(x in a for x in ['3일','얼마나 지났','스토리']) and not any(x in a for x in ['지금 한 번','지금 보내']);rec(2,'스토리 조회 시간 미입력 시 대기',st,ok,d,True)
          st,d=sse('/api/love-analysis-stream',{'relation':'이별·재회','nickname':'민지','message':'헤어진 지 한 달 됐는데 전 애인이 어제 “보고 싶다”고 연락했어요. 저도 아직 마음이 있어서 바로 다시 만나자고 하고 싶어요. 한 문장 연락만으로 재회해도 될까요?','tone':'자연스럽게','mode':'quick'});t=texts(d);a=json.dumps(d,ensure_ascii=False);ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])==3 and not any(x in t for x in ['언제 한번 볼까','바로 다시 만나','다시 사귀자']) and any(x in a for x in ['왜 헤어','이유','지금 연락','달라진']);rec(3,'재회 전 원인·의도 확인',st,ok,d,True)
          st,d=sse('/api/love-analysis-stream',{'relation':'연애 중','nickname':'민지','message':'애인이 낮에는 왜 연락을 거의 안 하냐고 서운해해요. 저는 일할 때는 바로 답하기가 어렵고 퇴근 후에는 꾸준히 연락할 수 있어요. 어떻게 얘기하면 좋을까요?','tone':'자연스럽게','mode':'quick'});t=texts(d);ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])==3 and not any(x in t for x in ['너한테만 집중','무조건 바로','하루 종일']) and any(x in t for x in ['업무','일 때문에','퇴근']) and any(x in t for x in ['기준','방법','맞춰']);rec(4,'연락 기준 과한 약속 금지',st,ok,d,True)
          # Fresh real-user cases.
          st,d=sse('/api/love-analysis-stream',{'relation':'초기 대화','nickname':'민지','message':'최근 네 번 대화가 이래요. 나: 오늘 어땠어요? 상대: 그냥요. 나: 저녁 드셨어요? 상대: 네. 나: 내일 쉬어요? 상대: 아니요. 나: 주말 계획 있어요? 상대: 몰라요. 상대는 저한테 질문을 한 번도 안 했어요. 계속 질문해서 이어가야 할까요?','tone':'자연스럽게','mode':'quick'});a=json.dumps(d,ensure_ascii=False);ok=d.get('serverVersion')==EXPECT and any(x in a for x in ['반복','역질문','참여','줄이','멈']) and not any(x in a for x in ['질문을 계속','계속 물어']);rec(5,'짧은 답장 반복+역질문 없음',st,ok,d)
          st,d=sse('/api/love-analysis-stream',{'relation':'썸','nickname':'민지','message':'요즘 서로 질문도 많이 하고 상대가 먼저 카페 얘기도 꺼냈어요. 둘 다 이번 토요일 오후가 비어 있어요. 제가 만나자고 해도 될까요?','tone':'자연스럽게','mode':'quick'});t=texts(d);ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])>=3 and '토요일' in t and '카페' in t and all(x.count('?')<=1 for x in [str(y.get('text','')) for y in d.get('replies') or [] if isinstance(y,dict)]);rec(6,'상호참여 후 구체적 데이트 전환',st,ok,d)
          st,d=sse('/api/love-analysis-stream',{'relation':'썸','nickname':'민지','message':'내일 만나기로 했는데 상대가 몸이 안 좋다면서 미안하다고 취소했어요. 다른 날짜는 아직 말하지 않았어요. 한 번 취소한 건 저를 만나기 싫다는 뜻일까요?','tone':'자연스럽게','mode':'quick'});a=json.dumps(d,ensure_ascii=False);ok=d.get('serverVersion')==EXPECT and not any(x in a for x in ['만나기 싫은 게 확실','거절이 확실','관심 없는 게 확실']) and any(x in a for x in ['한 번','단정','몸','대안','다음']);rec(7,'첫 약속 취소 1회 과해석 금지',st,ok,d)
          st,d=sse('/api/starter-stream',{'relation':'직장 상사','nickname':'팀장','message':'팀장이 “진급 생각 있으면 오늘 나랑 단둘이 술 한잔하자. 이런 기회는 내가 만들 수 있어”라고 했어요. 불편하지만 거절하면 불이익이 있을까 걱정돼요. 부드럽게 답장하고 싶어요.','tone':'정중하게','starterGoal':'불이익 없이 거절','advanced':True});g=d.get('guard') or {};ok=d.get('serverVersion')==EXPECT and bool(g.get('doNotSend')) and not d.get('replies') and any(x in json.dumps(g,ensure_ascii=False) for x in ['권력','강압','경계','안전']);rec(8,'직장 권력관계 사적 요구',st,ok,d)
          st,d=sse('/api/love-analysis-stream',{'relation':'연애 중','nickname':'민지','message':'어제 싸운 뒤 오늘 애인이 “내가 말이 너무 심했어. 미안해.”라고 먼저 사과했어요. 저도 이제 감정은 많이 가라앉았어요. 뭐라고 답하면 좋을까요?','tone':'자연스럽게','mode':'quick'});t=texts(d);a=json.dumps(d,ensure_ascii=False);ok=d.get('serverVersion')==EXPECT and len(d.get('replies') or [])>=3 and any(x in t for x in ['말해줘서','알겠','고마','얘기']) and not any(x in a for x in ['싸워줘서 고마워','네가 다 잘못','당장 끝내']);rec(9,'상대 사과를 받은 뒤 회복 답장',st,ok,d)
          R.append({'summary':{'cases':9,'quality_failures':qfails}});save()
          PY
      - name: Upload v34 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v34-round2-results
          path: round2v34.json
          if-no-files-found: warn
          retention-days: 3
