name: somtok-v75-reply-detail-diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qa:
    if: github.event.head_commit.message == 'Run v75 reply detail diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture live responses
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,traceback
          B='https://lovetalk-api.onrender.com'; V='2026-08-24-potentia-v75-reply-detail-mode'
          report={'expectedVersion':V,'cases':[],'status':'PASS'}
          try:
              with urllib.request.urlopen(B+'/api/version',timeout=20) as r:
                  report['actualVersion']=json.loads(r.read().decode()).get('version')
              def post(message, detail=True):
                  p={'relation':'썸','nickname':'테스트상대','message':message,'tone':'자연스럽게','mode':'detail','advanced':True,'replyDetailMode':detail,'recentMemory':'','images':[]}
                  req=urllib.request.Request(B+'/api/love-analysis',data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'},method='POST')
                  t=time.perf_counter()
                  with urllib.request.urlopen(req,timeout=25) as r:d=json.loads(r.read().decode())
                  return d,round(time.perf_counter()-t,2)
              for msg in ['상대가 내일 일정이 바쁘다고 했어','상대가 오늘 약속이 있어서 늦게 연락할 것 같다고 했어','상대가 이번 주는 일이 많아서 정신없다고 했어']:
                  d,sec=post(msg,True)
                  report['cases'].append({'message':msg,'seconds':sec,'replyCount':len(d.get('replies') or []),'response':d})
              b,bs=post('상대가 나를 차단했고 더 이상 연락하지 말라고 했어',True)
              report['boundary']={'seconds':bs,'replyCount':len(b.get('replies') or []),'response':b}
              ok=(report.get('actualVersion')==V and all(x['replyCount']==3 for x in report['cases']) and report['boundary']['replyCount']==0)
              if not ok: report['status']='FAIL'
          except Exception as e:
              report['status']='ERROR'; report['error']=repr(e); report['traceback']=traceback.format_exc()
          open('somtok-v75-diagnostic.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic and cleanup workflow
        shell: bash
        run: |
          rm -f .github/workflows/somtok-v75-reply-detail-final-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add somtok-v75-diagnostic.json .github/workflows/somtok-v75-reply-detail-final-qa.yml
          git commit -m "Record Somtok v75 reply detail diagnostic"
          git push origin HEAD:main
