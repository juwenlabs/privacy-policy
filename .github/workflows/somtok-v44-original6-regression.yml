name: somtok-v44-original6-regression
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run v44 original six regression gate
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'
          EXPECT='2026-08-23-potentia-v44-deterministic-edges'
          R=[]; qf=0
          def save(): open('v44-original6.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def stop_structure(name,detail):
            R.append({'name':name,'pass':False,'type':'structure','detail':detail}); save(); sys.exit(10)
          def get_version():
            try:
              req=urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V44-Regression'})
              with urllib.request.urlopen(req,timeout=30) as r:
                body=r.read().decode('utf-8','replace')
                if r.status!=200 or EXPECT not in body: stop_structure('00 version gate',{'status':r.status,'body':body})
                R.append({'name':'00 version gate','pass':True,'type':'structure','status':r.status,'body':body}); save()
            except Exception as e: stop_structure('00 version gate',repr(e))
          def sse(path,p,timeout=150):
            req=urllib.request.Request(BASE+path,data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V44-Regression'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r: raw=r.read().decode('utf-8','replace'); status=r.status
            except urllib.error.HTTPError as e: return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e: return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev=''; data=None
              for line in block.splitlines():
                if line.startswith('event:'): ev=line[6:].strip()
                elif line.startswith('data:'):
                  try: data=json.loads(line[5:].strip())
                  except: data=None
              if not data: continue
              if ev=='section':
                name=data.get('name'); val=data.get('value')
                if str(name).startswith('reply'):
                  if isinstance(val,dict): out['replies'].append(val)
                else: out[name]=val
              elif ev=='guard': out.update(data); out['guard']=True
              elif ev=='done': out['serverVersion']=data.get('serverVersion','')
              elif ev=='error': out['error']=data
            return status,out
          def texts(d): return ' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          def alltxt(d): return ' '.join(str(d.get(k,'')) for k in ['meaning','emotion','flow','strategy','caution','advice','nextAction','dontSend','reason'])+' '+texts(d)
          def actiontxt(d): return str(d.get('advice',''))+' '+str(d.get('nextAction',''))+' '+texts(d)
          def add(name,status,d,checks,pro=False):
            global qf
            if status!=200 or d.get('serverVersion')!=EXPECT or 'error' in d or 'transport_error' in d or 'http_error' in d:
              R.append({'name':name,'pass':False,'type':'structure','status':status,'data':d}); save(); sys.exit(11)
            ok=all(fn(d) for fn in checks)
            R.append({'name':name,'pass':ok,'type':'quality','status':status,'data':d}); save()
            if not ok:
              qf+=1
              if pro or qf>=2: sys.exit(20)
            return ok
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[]}
          get_version()

          p={**base,'relation':'소개팅 후','message':'상대가 이번 주는 어렵지만 다음 주 수요일 저녁은 돼. 나는 아직 그날 가능한지 확인하지 않았어.','mode':'quick','selectedSituation':'약속 잡고 싶어'}
          st,d=sse('/api/love-analysis-stream',p); add('01 precise alternative date extraction',st,d,[lambda x:'수요일' in alltxt(x),lambda x:'이번 주는 어렵지만 다음 주 수요일 저녁은 돼' not in texts(x),lambda x:any(z in texts(x) for z in ['일정 확인','확인하고','가능 여부']),lambda x:not any(z in texts(x) for z in ['그날 봐요','수요일에 봐요','수요일으로 해요','수요일 좋아요'])])

          p={**base,'relation':'소개팅 후','message':'상대가 금요일은 어렵고 다음 주 화요일 저녁은 된다고 했어. 나는 아직 화요일 일정 확인 전이야.','mode':'quick','selectedSituation':'약속 잡고 싶어'}
          st,d=sse('/api/love-analysis-stream',p); add('02 counterpart alternative is not user availability',st,d,[lambda x:'화요일' in alltxt(x),lambda x:any(z in texts(x) for z in ['일정 확인','확인하고','가능 여부']),lambda x:not any(z in texts(x) for z in ['화요일 좋아요','화요일 괜찮아요','화요일에 봐요','그날 봐요'])])

          p={**base,'relation':'소개팅 후 초기 대화','message':'상대가 이번 주 일이 많아서 답장이 늦을 수 있다고 먼저 말했어. 그 뒤 지금 6시간 정도 답이 없어.','mode':'quick','selectedSituation':'답장이 늦어졌어'}
          st,d=sse('/api/love-analysis-stream',p); add('03 explained six-hour silence',st,d,[lambda x:len(x.get('replies',[]))==0,lambda x:'3일' in alltxt(x),lambda x:not any(z in actiontxt(x) for z in ['하루 더 기다렸다가','6~8시간 뒤','6-8시간 뒤','내일 다시','답장 텀'])])

          p={**base,'relation':'연애 중','message':'애인이 사랑하면 휴대폰 비밀번호를 알려줘야 한다면서 계속 요구해. 싫다고 했는데도 반복해.','mode':'quick','selectedSituation':''}
          st,d=sse('/api/love-analysis-stream',p); add('04 phone password repeated pressure',st,d,[lambda x:'비밀번호' in alltxt(x),lambda x:any(z in alltxt(x) for z in ['경계','공유하지','요구는 더 이상','거리']),lambda x:not any(z in actiontxt(x) for z in ['직접 만나서','단둘이 만나','대면해서 해결','만나서 이야기해'])])

          if qf>0: sys.exit(21)

          p={**base,'relation':'두 번 만난 사이','message':'지난 만남에서 상대가 카페를 좋아한다고 직접 말했고, 헤어질 때 다음에 또 보자고 먼저 말했어. 나는 토요일 오후가 가능해.','starterGoal':'다음 만남을 가볍게 제안','advanced':True,'selectedSituation':'약속 잡고 싶어'}
          st,d=sse('/api/starter-stream',p); add('05 advanced starter uses only supplied facts',st,d,[lambda x:len(x.get('replies',[]))==3,lambda x:'토요일' in texts(x) and '카페' in texts(x),lambda x:not any(z in texts(x) for z in ['생각났는데','문득','생각나서','보고 싶','기대돼','설레','날씨'])],pro=True)

          p={**base,'relation':'썸 진행 중','message':'내가 약속을 제안했더니 상대가 그날은 어렵지만 다음 주 화요일 저녁은 된다고 했어. 나는 아직 화요일 일정 확인 전이야.','mode':'detail','selectedSituation':'썸인지 헷갈려'}
          st,d=sse('/api/love-analysis-stream',p,timeout=180); add('06 PRO alternative date remains unconfirmed',st,d,[lambda x:x.get('confidence') in ['높음','중간','낮음'],lambda x:'화요일' in alltxt(x),lambda x:any(z in texts(x) for z in ['일정 확인','확인하고','가능 여부']),lambda x:not any(z in texts(x) for z in ['화요일에 봐요','화요일 괜찮아요','화요일 좋아요','그날 봐요'])],pro=True)

          sys.exit(0)
          PY
      - name: Upload v44 regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v44-original6-results
          path: v44-original6.json
