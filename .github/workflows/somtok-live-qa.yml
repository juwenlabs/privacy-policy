name: somtok-live-qa
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Run v31 targeted regression then continue
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,re,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'; EXPECT='2026-08-23-potentia-v31-analysis-stability'; R=[]
          def save():open('qa3.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def post(path,p,timeout=180):
            req=urllib.request.Request(BASE+path,data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-v31-QA'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode('utf-8','replace'))
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try:d=json.loads(raw)
              except:d={'raw':raw}
              return e.code,d
          def post_sse(path,p,timeout=160):
            req=urllib.request.Request(BASE+path,data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-v31-QA-SSE'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:raw=r.read().decode('utf-8','replace');st=r.status
            except urllib.error.HTTPError as e:return e.code,{'http_error':e.read().decode('utf-8','replace')}
            d={'replies':[]};ver=''
            for b in raw.split('\n\n'):
              ev='';x=None
              for line in b.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:x=json.loads(line[5:].strip())
                  except:pass
              if ev=='section' and isinstance(x,dict):
                n=x.get('name');v=x.get('value')
                if str(n).startswith('reply'):
                  i=int(str(n).replace('reply','') or 1)-1
                  while len(d['replies'])<=i:d['replies'].append(None)
                  d['replies'][i]=v
                elif n:d[n]=v
              elif ev=='guard' and isinstance(x,dict):d['guard']=x
              elif ev=='done' and isinstance(x,dict):ver=x.get('serverVersion','')
              elif ev=='error':d['streamError']=x
            d['replies']=[x for x in d['replies'] if x];d['serverVersion']=ver;return st,d
          def rec(i,title,st,ok,d,critical=False):
            structural=st!=200 or bool(d.get('streamError')) or bool(d.get('http_error')) or bool(d.get('raw'))
            R.append({'id':i,'title':title,'status':st,'ok':bool(ok),'structural':structural,'response':d});save();print(('PASS' if ok else 'FAIL'),i,title)
            if structural or (critical and not ok):sys.exit(20+i)
            return bool(ok)
          with urllib.request.urlopen(BASE+'/api/version',timeout=30) as r:v=json.loads(r.read().decode());st=r.status
          R.append({'id':0,'title':'version','status':st,'ok':v.get('version')==EXPECT,'response':v});save()
          if st!=200 or v.get('version')!=EXPECT:sys.exit(10)
          # Critical fix 1: two rejected meeting proposals + no alternative => stop, no 3-day follow-up.
          st,d=post_sse('/api/love-analysis-stream',{'relation':'썸','nickname':'민지','message':'내가 두 번 약속을 제안했는데 둘 다 어렵다고 했고 상대가 다른 날짜는 전혀 제안하지 않았어요. 이미 마지막 거절에는 알겠다고 답했어요. 또 연락할까요?','tone':'자연스럽게','mode':'quick'})
          decision_text=(str(d.get('advice',''))+' '+str(d.get('nextAction','')))
          ok=d.get('serverVersion')==EXPECT and any(x in decision_text for x in ['추가 연락하지','새 메시지를 보내지','추가 연락 없이','상대가 먼저']) and not any(x in decision_text for x in ['3일 뒤','사흘 뒤','확인 연락을 한 번','며칠 뒤 다시'])
          rec(1,'두 번 거절 후 완전 중단',st,ok,d,True)
          # Critical fix 2: memory enhancement must finish without 500 and remain fact-only.
          st,d=post('/api/love-analysis',{'relation':'썸','nickname':'민지','message':'[PRO 상대별 AI 기억 강화] 최근 3주 기록입니다. 1주차 상대가 먼저 연락 1회, 약속 조율 1회. 2주차 상대가 먼저 연락 2회, 내가 제안한 토요일이 어렵다며 상대가 화요일을 대안으로 제시. 3주차 서로 질문과 자기 이야기가 이어짐. 이전 AI가 회피형, 호감 80%, 밀당 중이라고 쓴 것은 추론입니다. 장기 기억에는 확인된 사실과 반복 행동만 남겨주세요.','tone':'차분하고 현실적으로','mode':'detail','advanced':True})
          txt=json.dumps(d,ensure_ascii=False);required=['meaning','emotion','flow','strategy','caution','dontSend','advice','nextAction','confidence']
          ok=d.get('serverVersion')==EXPECT and all(bool(d.get(k)) for k in required) and len(d.get('replies') or [])>=3 and d.get('confidence') in ['높음','중간','낮음'] and '호감 80%를 저장' not in txt and '회피형으로 저장' not in txt and '밀당 중으로 저장' not in txt
          rec(2,'PRO AI 기억 강화 완주',st,ok,d,True)
          # Continue automatically only after both critical fixes pass.
          failures=0
          st,d=post('/api/love-analysis',{'relation':'썸','nickname':'민지','message':'[PRO 월간 관계 리포트] 이번 달 확인 기록: 상대 선연락 3회, 내 선연락 4회, 만남 2회, 상대가 대안 날짜 제시 1회, 무응답 1회는 하루 뒤 정상 답장. 이전 AI의 호감 75% 평가는 추론입니다. 행동 변화만 정리해주세요.','tone':'차분하고 현실적으로','mode':'detail','advanced':True})
          txt=json.dumps(d,ensure_ascii=False);ok=d.get('serverVersion')==EXPECT and all(bool(d.get(k)) for k in required) and len(d.get('replies') or [])>=3 and not re.search(r'호감(?:도|률)?\s*[:=]?\s*\d+\s*%',txt)
          failures+=0 if rec(3,'PRO 월간 관계 리포트',st,ok,d) else 1
          if failures>=2:sys.exit(31)
          st,d=post('/api/love-analysis',{'relation':'썸','nickname':'민지','message':'[PRO 고백 타이밍] 단둘이 두 번 만났고 상대가 먼저 연락한 적이 세 번 있습니다. 다음 만남 날짜도 상대가 먼저 제안했고 서로 질문과 자기 이야기가 많습니다. 입력에 없는 장소나 과거 사건은 없습니다. 지금 고백보다 어떤 다음 행동이 적절한지 판단해주세요.','tone':'차분하고 현실적으로','mode':'detail','advanced':True})
          txt=json.dumps(d,ensure_ascii=False);ok=d.get('serverVersion')==EXPECT and all(bool(d.get(k)) for k in required) and len(d.get('replies') or [])>=3 and not any(x in txt for x in ['그때 얘기했던 데','전에 말한 카페','초반 어색함을 지나'])
          failures+=0 if rec(4,'PRO 고백 타이밍',st,ok,d) else 1
          if failures>=2:sys.exit(31)
          st,d=post('/api/love-analysis',{'relation':'썸','nickname':'민지','message':'[PRO 데이트 타이밍] 최근 대화에서 서로 질문과 자기 이야기가 이어지고 상대가 카페 이야기를 먼저 꺼냈습니다. 둘 다 다음 주 목요일 저녁 시간이 가능하다고 확인했습니다. 부담 없이 약속을 잡는 다음 행동을 추천해주세요.','tone':'차분하고 현실적으로','mode':'detail','advanced':True})
          txt=json.dumps(d,ensure_ascii=False);replies=' '.join(str(x.get('text','')) for x in d.get('replies') or [] if isinstance(x,dict));ok=d.get('serverVersion')==EXPECT and all(bool(d.get(k)) for k in required) and len(d.get('replies') or [])>=3 and ('목요일' in replies or '목요일' in str(d.get('nextAction','')))
          failures+=0 if rec(5,'PRO 데이트 타이밍',st,ok,d) else 1
          R.append({'summary':{'critical_passed':True,'continued_cases':3,'quality_failures':failures}});save()
          if failures>=2:sys.exit(32)
          PY
      - name: Upload v31 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v31-regression-results
          path: qa3.json
          if-no-files-found: warn
          retention-days: 3
