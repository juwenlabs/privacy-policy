name: somtok-live-qa
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run v28 cheap final regression
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,sys
          BASE='https://lovetalk-api.onrender.com';EXPECT='2026-08-23-potentia-v28-truthful-messages';out=[]
          def save():open('somtok_v28_final.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          def sse(path,payload):
              req=urllib.request.Request(BASE+path,data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-v28-Final'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:raw=r.read().decode('utf-8','replace');st=r.status
              except urllib.error.HTTPError as e:return e.code,{'error':e.read().decode('utf-8','replace')}
              d={'replies':[]};version=''
              for block in raw.split('\n\n'):
                  ev='';data=None
                  for line in block.splitlines():
                      if line.startswith('event:'):ev=line[6:].strip()
                      elif line.startswith('data:'):
                          try:data=json.loads(line[5:].strip())
                          except:pass
                  if ev=='section' and isinstance(data,dict):
                      n=data.get('name');v=data.get('value')
                      if str(n).startswith('reply'):
                          i=int(str(n).replace('reply','') or 1)-1
                          while len(d['replies'])<=i:d['replies'].append(None)
                          d['replies'][i]=v
                      elif n:d[n]=v
                  elif ev=='guard' and isinstance(data,dict):d['guard']=data
                  elif ev=='done' and isinstance(data,dict):version=data.get('serverVersion','')
                  elif ev=='error':d['streamError']=data
              d['replies']=[x for x in d['replies'] if x];d['serverVersion']=version
              return st,d
          def check(title,st,d,ok):
              out.append({'title':title,'status':st,'ok':bool(ok),'response':d});save();print(('PASS' if ok else 'FAIL'),title)
              if not ok:sys.exit(2)

          # 1. Preserve the corrected 3-day rule on the actual app SSE path.
          st,d=sse('/api/love-analysis-stream',{'relation':'초기 대화','nickname':'민지','message':'내가 3일 전에 “오늘 하루 어땠어요?”라고 보냈고 아직 답이 없습니다. 후속 메시지는 아직 한 번도 보내지 않았고 비긴급 상황입니다.','tone':'자연스럽게','mode':'quick','selectedSituation':'읽씹 당했어'})
          t=json.dumps(d,ensure_ascii=False);a=str(d.get('advice',''))+' '+str(d.get('nextAction',''));r=' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          ok=(st==200 and d.get('serverVersion')==EXPECT and len(d.get('replies') or [])>=3 and '지금' in a and ('한 번' in a or '한번' in a) and any(x in r for x in ['편하게 연락','여유 생기면']) and not any(x in t for x in ['3일 더','총 약 6일','다시 3일']))
          check('1 3일 무응답 실제 SSE',st,d,ok)

          # 2. Explicit rejection must use truthful closure, not invented user feelings.
          st,d=sse('/api/love-analysis-stream',{'relation':'소개팅','nickname':'민지','message':'상대: 좋은 분인 건 맞는데 이성적으로는 아닌 것 같아요. 더 만나지는 않을게요.','tone':'자연스럽게','mode':'quick'})
          r=' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict));a=str(d.get('advice',''))+' '+str(d.get('nextAction',''))
          invented=['만날 수 있어서 좋았','만나서 좋았','반가웠','즐거웠','좋은 인연으로 남','나중에 다시']
          ok=(st==200 and d.get('serverVersion')==EXPECT and len(d.get('replies') or [])>=3 and any(x in r for x in ['알겠습니다','말씀해주셔서 감사']) and any(x in a for x in ['추가 설득','더 이상 연락','마무리','존중']) and not any(x in r for x in invented))
          check('2 명확한 거절 사실기반 SSE',st,d,ok)

          # 3. Initial number exchange starter must not invent either person's feelings/state.
          st,d=sse('/api/starter-stream',{'relation':'번호 교환','nickname':'민지','message':'오늘 행사에서 처음 만나 번호를 교환했고 집에 도착했을 시간입니다. 아직 반말하기로 한 적은 없습니다.','tone':'자연스럽게','starterGoal':'대화를 자연스럽게 열기','advanced':True})
          r=' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict));bad=['만나서 좋았','더 좋았','반가웠','즐거웠','쉬고 있','쉬어 있','피곤할','행사 때보다','ㅋㅋ','ㅎㅎ']
          safe=all(any(q in str(x.get('text','')) for q in ['잘 들어가셨','잘 도착','마무리는 잘']) for x in d.get('replies',[]) if isinstance(x,dict))
          ok=(st==200 and d.get('serverVersion')==EXPECT and len(d.get('replies') or [])>=3 and safe and not any(x in r for x in bad) and not d.get('streamError'))
          check('3 번호교환 고급선톡 사실기반 SSE',st,d,ok)
          PY
      - name: Upload v28 final results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v28-final
          path: somtok_v28_final.json
          if-no-files-found: warn
          retention-days: 3
