name: somtok-v51-jazz-pro
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run v51 jazz advanced starter PRO
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'; EXPECT='2026-08-23-potentia-v51-reciprocal-grounding'
          R=[]
          def save():open('v51-jazz.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def sse(p,timeout=170):
            req=urllib.request.Request(BASE+'/api/starter-stream',data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V51-Jazz-PRO'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:raw=r.read().decode('utf-8','replace');status=r.status
            except urllib.error.HTTPError as e:return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e:return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev='';data=None
              for line in block.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:data=json.loads(line[5:].strip())
                  except:data=None
              if not data:continue
              if ev=='section':
                n=data.get('name');v=data.get('value')
                if str(n).startswith('reply') and isinstance(v,dict):out['replies'].append(v)
              elif ev=='guard':out.update(data);out['guard']=True
              elif ev=='done':out['serverVersion']=data.get('serverVersion','')
              elif ev=='error':out['error']=data
            return status,out
          def texts(d):return ' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          try:
            with urllib.request.urlopen(urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V51-Jazz-PRO'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body:
                R.append({'name':'00 version','pass':False,'type':'structure','status':r.status,'body':body});save();sys.exit(10)
          except Exception as e:
            R.append({'name':'00 version','pass':False,'type':'structure','error':repr(e)});save();sys.exit(10)
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[]}
          p={**base,'relation':'두 번 대화한 사이','message':'상대가 재즈 음악을 좋아한다고 직접 말했어. 나는 이번 금요일 저녁이 가능해. 그 외에는 상대 취향이나 최근 상황을 몰라.','starterGoal':'가볍게 다음 만남 제안','advanced':True,'selectedSituation':'약속 잡고 싶어'}
          st,d=sse(p)
          structure=(st==200 and d.get('serverVersion')==EXPECT and not any(k in d for k in ['error','http_error','transport_error']) and len(d.get('replies',[]))>=1)
          t=texts(d)
          quality=(structure
            and '재즈' in t and '금요일' in t
            and not any(z in t for z in ['생각나서','생각났','문득','떠올라서'])
            and not any(z in t for z in ['저도 재즈','나도 재즈','같이 들었던','지난번 재즈'])
            and not any(z in t for z in ['재즈바','공연장','카페','콘서트'])
            and '날씨' not in t
            and all(str(r.get('text','')).count('?')<=1 for r in d.get('replies',[]) if isinstance(r,dict))
          )
          R.append({'name':'01 advanced starter jazz grounded','pass':quality,'type':'quality' if structure else 'structure','status':st,'data':d});save()
          if not structure:sys.exit(10)
          if not quality:sys.exit(20)
          PY
      - name: Upload v51 jazz result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v51-jazz-result
          path: v51-jazz.json
