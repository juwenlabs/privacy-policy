name: somtok-v46-pro-vague-schedule
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retest v46 PRO vague schedule only
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error,re
          BASE='https://lovetalk-api.onrender.com'; EXPECT='2026-08-23-potentia-v46-grounding-participation-guards'; R=[]
          def save():open('v46-pro-vague.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          try:
            with urllib.request.urlopen(urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V46-PRO-Vague'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body:R.append({'name':'00 version gate','pass':False,'type':'structure','status':r.status,'body':body});save();sys.exit(10)
              R.append({'name':'00 version gate','pass':True,'type':'structure','status':r.status,'body':body});save()
          except Exception as e:R.append({'name':'00 version gate','pass':False,'type':'structure','error':repr(e)});save();sys.exit(10)
          p={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[],'relation':'썸 진행 중','message':'상대가 "다음 주 중에는 한 번 보자"라고 했어. 나는 아직 가능한 날짜를 말하지 않았고 상대도 요일이나 시간은 정하지 않았어.','mode':'detail','selectedSituation':'썸인지 헷갈려'}
          req=urllib.request.Request(BASE+'/api/love-analysis-stream',data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V46-PRO-Vague'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=180) as r:raw=r.read().decode('utf-8','replace');status=r.status
          except urllib.error.HTTPError as e:R.append({'name':'01 PRO vague schedule','pass':False,'type':'structure','status':e.code,'body':e.read().decode('utf-8','replace')});save();sys.exit(11)
          except Exception as e:R.append({'name':'01 PRO vague schedule','pass':False,'type':'structure','error':repr(e)});save();sys.exit(11)
          d={'replies':[],'serverVersion':''}
          for block in raw.replace('\r\n','\n').split('\n\n'):
            ev='';data=None
            for line in block.splitlines():
              if line.startswith('event:'):ev=line[6:].strip()
              elif line.startswith('data:'):
                try:data=json.loads(line[5:].strip())
                except:data=None
            if not data:continue
            if ev=='section':
              n=data.get('name');v=data.get('value')
              if str(n).startswith('reply'):
                if isinstance(v,dict):d['replies'].append(v)
              else:d[n]=v
            elif ev=='done':d['serverVersion']=data.get('serverVersion','')
            elif ev=='error':d['error']=data
          if status!=200 or d.get('serverVersion')!=EXPECT or 'error' in d:R.append({'name':'01 PRO vague schedule','pass':False,'type':'structure','status':status,'data':d});save();sys.exit(11)
          texts=' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          checks={
            'three_replies':len(d.get('replies',[]))==3,
            'no_specific_weekday':not any(z in texts for z in ['월요일','화요일','수요일','목요일','금요일','토요일','일요일']),
            'no_user_availability_invention':not any(z in texts for z in ['저는 다음 주','평일 저녁','제가 가능한','저는 가능']),
            'no_specific_time':not re.search(r'(?:오전|오후|저녁|\d{1,2}\s*시)',texts),
            'no_scheduled_followup':not any(z in str(d.get('nextAction','')) for z in ['하루이틀','1~2일','이틀 정도']),
            'max_one_question':all(str(x.get('text','')).count('?')<=1 for x in d.get('replies',[]) if isinstance(x,dict))
          }
          ok=all(checks.values());R.append({'name':'01 PRO vague schedule','pass':ok,'type':'quality','status':status,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)
          PY
      - name: Upload v46 PRO vague result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v46-pro-vague-result
          path: v46-pro-vague.json
