name: somtok-v45-targeted-retest
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retest v45 PRO alternative-date grounding
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'
          EXPECT='2026-08-23-potentia-v45-detail-role-binding'
          OUT=[]
          def save(): open('v45-targeted.json','w',encoding='utf-8').write(json.dumps(OUT,ensure_ascii=False,indent=2))
          def fail(kind,name,detail,code): OUT.append({'name':name,'pass':False,'type':kind,'detail':detail}); save(); sys.exit(code)
          try:
            req=urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V45-Targeted'})
            with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body: fail('structure','00 version gate',{'status':r.status,'body':body},10)
              OUT.append({'name':'00 version gate','pass':True,'type':'structure','status':r.status,'body':body}); save()
          except Exception as e: fail('structure','00 version gate',repr(e),10)
          def sse(path,p,timeout=120):
            req=urllib.request.Request(BASE+path,data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V45-Targeted'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r: raw=r.read().decode('utf-8','replace'); status=r.status
            except urllib.error.HTTPError as e: return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e: return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev=''; data=None
              for line in block.splitlines():
                if line.startswith('event:'): ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:data=json.loads(line[5:].strip())
                  except:data=None
              if not data: continue
              if ev=='section':
                name=data.get('name'); val=data.get('value')
                if str(name).startswith('reply'):
                  if isinstance(val,dict): out['replies'].append(val)
                else: out[name]=val
              elif ev=='guard': out.update(data); out['guard']=True
              elif ev=='done': out['serverVersion']=data.get('serverVersion','')
              elif ev=='error': out['error']=data
            return status,out
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[]}
          p={**base,'relation':'썸 진행 중','message':'내가 약속을 제안했더니 상대가 그날은 어렵지만 다음 주 화요일 저녁은 된다고 했어. 나는 아직 화요일 일정 확인 전이야.','mode':'detail','selectedSituation':'썸인지 헷갈려'}
          st,d=sse('/api/love-analysis-stream',p)
          if st!=200 or d.get('serverVersion')!=EXPECT or 'error' in d or 'http_error' in d or 'transport_error' in d:
            fail('structure','01 PRO unconfirmed alternative date',{'status':st,'data':d},11)
          texts=' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          alltxt=' '.join(str(d.get(k,'')) for k in ['meaning','emotion','flow','strategy','caution','dontSend','advice','nextAction'])+' '+texts
          checks={
            'three_replies':len(d.get('replies',[]))==3,
            'mentions_tuesday':'화요일' in alltxt,
            'states_unconfirmed':any(z in alltxt for z in ['확인되지','확인 전','일정 확인','가능 여부']),
            'replies_only_check_schedule':all(any(z in str(r.get('text','')) for z in ['일정 확인','확인해보고','확인 후']) for r in d.get('replies',[]) if isinstance(r,dict)),
            'no_invented_acceptance':not any(z in texts for z in ['괜찮을 것 같','넵 좋아','좋아요','그날 봐','화요일에 봐','가능할 것 같']),
            'no_invented_deadline':'오늘 안에' not in (str(d.get('advice',''))+' '+str(d.get('nextAction',''))),
            'max_one_question':all(str(r.get('text','')).count('?')<=1 for r in d.get('replies',[]) if isinstance(r,dict))
          }
          ok=all(checks.values())
          OUT.append({'name':'01 PRO unconfirmed alternative date','pass':ok,'type':'quality','status':st,'checks':checks,'data':d}); save()
          if not ok: sys.exit(20)
          PY
      - name: Upload v45 targeted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v45-targeted-result
          path: v45-targeted.json
