name: somtok-v54-round4-pro
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run v54 round4 PRO QA
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'
          EXPECT='2026-08-23-potentia-v54-unavailable-boundary-priority'
          R=[]
          def save():
            open('v54-round4-pro.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def hard(name,status,d):
            R.append({'name':name,'pass':False,'type':'structure','status':status,'data':d});save();sys.exit(10)
          def sse(path,p,timeout=190):
            req=urllib.request.Request(BASE+path,data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V54-R4-PRO'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:
                raw=r.read().decode('utf-8','replace');status=r.status
            except urllib.error.HTTPError as e:
              return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e:
              return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev='';data=None
              for line in block.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:data=json.loads(line[5:].strip())
                  except:data=None
              if not data:continue
              if ev=='section':
                n=data.get('name');v=data.get('value')
                if str(n).startswith('reply'):
                  if isinstance(v,dict):out['replies'].append(v)
                else:out[n]=v
              elif ev=='guard':
                out.update(data);out['guard']=True
              elif ev=='done':
                out['serverVersion']=data.get('serverVersion','')
              elif ev=='error':
                out['error']=data
            return status,out
          def texts(d):
            return ' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          def alltxt(d):
            return ' '.join(str(d.get(k,'')) for k in ['meaning','confidence','emotion','flow','strategy','caution','dontSend','advice','nextAction'])+' '+texts(d)
          try:
            with urllib.request.urlopen(urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V54-R4-PRO'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body:hard('00 version gate',r.status,{'body':body})
              R.append({'name':'00 version gate','pass':True,'type':'structure','status':r.status,'body':body});save()
          except Exception as e:
            hard('00 version gate',0,{'error':repr(e)})
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[]}

          p={**base,'relation':'첫 만남 이후','message':'처음 만난 뒤 상대가 다음날 먼저 "잘 들어갔어요?"라고 연락했고, 이후 서로 질문도 주고받았어. 대화 중 상대가 "다음에 또 봐요"라고 했지만 날짜나 시간은 전혀 정하지 않았고, 나는 언제 가능한지 아직 말하지 않았어. 지금 관계를 상세히 봐줘.','mode':'detail','selectedSituation':'썸인지 헷갈려'}
          st,d=sse('/api/love-analysis-stream',p)
          if st!=200 or d.get('serverVersion')!=EXPECT or any(k in d for k in ['error','http_error','transport_error']):hard('01 PRO vague future meeting balanced',st,d)
          t=texts(d); a=alltxt(d); me=str(d.get('meaning',''))+' '+str(d.get('emotion',''))
          checks={
            'has_confidence':d.get('confidence') in ['높음','중간','낮음'],
            'acknowledges_participation':any(z in a for z in ['먼저 연락','서로 질문','양방향','참여']),
            'not_confirmed_meeting':any(z in a for z in ['구체적','확정','날짜','시간']) and not any(z in me for z in ['약속이 확정','만남이 확정']),
            'no_certainty':not any(z in me for z in ['썸이 확실','호감이 확실','서로 좋아하고','연애로 갈 가능성이 높']),
            'no_invented_schedule':not any(z in t for z in ['이번 주','다음 주','주말','월요일','화요일','수요일','목요일','금요일','토요일','일요일']),
            'no_invented_place':not any(z in t for z in ['카페','영화관','식당','공원','술집']),
            'max_one_question':all(str(r.get('text','')).count('?')<=1 for r in d.get('replies',[]) if isinstance(r,dict))
          }
          ok=all(checks.values())
          R.append({'name':'01 PRO vague future meeting balanced','pass':ok,'type':'quality','status':st,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)

          p={**base,'relation':'두 번 대화한 사이','message':'상대가 전시 보는 걸 좋아한다고 직접 말했어. 나는 이번 토요일 오후가 가능해. 그 외에는 상대 취향이나 최근 상황을 몰라.','starterGoal':'가볍게 다음 만남 제안','advanced':True,'selectedSituation':'약속 잡고 싶어'}
          st,d=sse('/api/starter-stream',p)
          if st!=200 or d.get('serverVersion')!=EXPECT or any(k in d for k in ['error','http_error','transport_error']):hard('02 PRO advanced starter exhibition grounded',st,d)
          t=texts(d)
          checks={
            'three_replies':len(d.get('replies',[]))==3,
            'uses_preference':all('전시' in str(r.get('text','')) for r in d.get('replies',[]) if isinstance(r,dict)),
            'uses_availability':all('토요일' in str(r.get('text','')) for r in d.get('replies',[]) if isinstance(r,dict)),
            'no_fake_shared':not any(z in t for z in ['저도 전시','나도 전시','같이 봤던','지난번 전시']),
            'no_fake_place':not any(z in t for z in ['미술관','갤러리','전시장','카페']),
            'no_fake_thought':not any(z in t for z in ['생각나서','생각났','문득','떠올라서']),
            'no_weather':('날씨' not in t),
            'max_one_question':all(str(r.get('text','')).count('?')<=1 for r in d.get('replies',[]) if isinstance(r,dict))
          }
          ok=all(checks.values())
          R.append({'name':'02 PRO advanced starter exhibition grounded','pass':ok,'type':'quality','status':st,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)
          PY
      - name: Upload v54 round4 PRO results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v54-round4-pro-results
          path: v54-round4-pro.json
