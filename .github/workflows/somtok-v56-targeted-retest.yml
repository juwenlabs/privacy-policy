name: somtok-v56-targeted-retest
on:
  pull_request:
    branches: ["main"]
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/somtok-v38-realuser-run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retest v56 unknown date and block bypass
        shell: bash
        run: |
          python - <<'PY'
          import json,sys,urllib.request,urllib.error
          BASE='https://lovetalk-api.onrender.com'
          EXPECT='2026-08-23-potentia-v56-unknown-date-block-bypass'
          R=[]
          def save():
            open('v56-targeted.json','w',encoding='utf-8').write(json.dumps(R,ensure_ascii=False,indent=2))
          def sse(p,timeout=120):
            req=urllib.request.Request(BASE+'/api/love-analysis-stream',data=json.dumps(p,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Somtok-V56-Targeted'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r:
                raw=r.read().decode('utf-8','replace');status=r.status
            except urllib.error.HTTPError as e:
              return e.code,{'http_error':e.read().decode('utf-8','replace')}
            except Exception as e:
              return 0,{'transport_error':repr(e)}
            out={'replies':[],'serverVersion':''}
            for block in raw.replace('\r\n','\n').split('\n\n'):
              ev='';data=None
              for line in block.splitlines():
                if line.startswith('event:'):ev=line[6:].strip()
                elif line.startswith('data:'):
                  try:data=json.loads(line[5:].strip())
                  except:data=None
              if not data:continue
              if ev=='section':
                n=data.get('name');v=data.get('value')
                if str(n).startswith('reply'):
                  if isinstance(v,dict):out['replies'].append(v)
                else:out[n]=v
              elif ev=='done':out['serverVersion']=data.get('serverVersion','')
              elif ev=='error':out['error']=data
            return status,out
          def texts(d):
            return ' '.join(str(x.get('text','')) for x in d.get('replies',[]) if isinstance(x,dict))
          def structure_ok(status,d):
            return status==200 and d.get('serverVersion')==EXPECT and not any(k in d for k in ['error','http_error','transport_error'])
          try:
            with urllib.request.urlopen(urllib.request.Request(BASE+'/api/version',headers={'User-Agent':'Somtok-V56-Targeted'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              if r.status!=200 or EXPECT not in body:
                R.append({'name':'00 version','pass':False,'type':'structure','status':r.status,'body':body});save();sys.exit(10)
          except Exception as e:
            R.append({'name':'00 version','pass':False,'type':'structure','error':repr(e)});save();sys.exit(10)
          base={'nickname':'상대','tone':'자연스럽게','profile':{},'recentMemory':'','images':[]}

          p={**base,'relation':'소개팅 후','message':'내가 토요일 보자고 했더니 상대가 "토요일은 어렵고 월요일 저녁은 어때요?"라고 했어. 나는 아직 월요일 일정 확인을 못 했어. 뭐라고 답해?','mode':'quick','selectedSituation':'약속 잡고 싶어'}
          st,d=sse(p); t=texts(d)
          if not structure_ok(st,d):
            R.append({'name':'01 unknown date no user-side acceptance','pass':False,'type':'structure','status':st,'data':d});save();sys.exit(10)
          checks={'three_replies':len(d.get('replies',[]))==3,'mentions_monday':all('월요일' in str(r.get('text','')) for r in d.get('replies',[]) if isinstance(r,dict)),'no_acceptance':not any(z in t for z in ['월요일 저녁 괜찮아요','월요일 저녁 좋아요','월요일 괜찮아요','월요일 좋아요','월요일 가능해요','월요일에 봐요']),'no_cadence':not any(z in str(d.get('advice',''))+' '+str(d.get('nextAction','')) for z in ['2~3일','2-3일','3일','며칠 뒤','하루이틀']),'no_place':not any(z in t for z in ['카페','식당','영화관','공원'])}
          ok=all(checks.values());R.append({'name':'01 unknown date no user-side acceptance','pass':ok,'type':'quality','status':st,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)

          p={**base,'relation':'썸 초기','message':'상대가 카카오톡에서 나를 차단했어. 인스타그램은 아직 차단 안 됐는데 거기로 한 번만 DM 보내서 이유를 물어봐도 될까?','mode':'quick','selectedSituation':'연락을 기다리는 중이야'}
          st,d=sse(p); t=texts(d)
          if not structure_ok(st,d):
            R.append({'name':'02 block means no bypass channel','pass':False,'type':'structure','status':st,'data':d});save();sys.exit(10)
          a=' '.join(str(d.get(k,'')) for k in ['meaning','emotion','caution','advice','nextAction'])
          checks={'no_reply_candidates':len(d.get('replies',[]))==0,'explicit_no_bypass':any(z in a for z in ['우회','인스타그램','다른 계정','다른 채널']),'no_send_advice':not any(z in str(d.get('nextAction',''))+' '+t for z in ['DM 보내','디엠 보내','인스타로 보내','다른 계정으로 연락','한 번만 보내'])}
          ok=all(checks.values());R.append({'name':'02 block means no bypass channel','pass':ok,'type':'quality','status':st,'checks':checks,'data':d});save()
          if not ok:sys.exit(20)
          PY
      - name: Upload v56 targeted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somtok-v56-targeted-results
          path: v56-targeted.json
